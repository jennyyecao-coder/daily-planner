<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<style>
  :root {
    --hdr-bg:        #2c3e50;
    --hdr-dk:        #3d5166;
    --page-bg:       #cce8e4;
    --accent:        #7eccc4;
    --accent-dk:     #5bb8ae;
    --accent-lt:     #e0f5f3;
    --accent-md:     #a8dbd7;
    --accent-fg:     #1a2f3a;
    --accent-20:     rgba(126,204,196,.20);
    --accent-50:     rgba(126,204,196,.50);
    --day-a:         #7eccc4;
    --day-b:         #5bb8ae;
    --day-bdr:       #4aada4;
    --wknd-a:        #a8d8c8;
    --wknd-b:        #82c4af;
    --today-a:       #2c3e50;
    --today-b:       #3d5166;
    --today-num-bg:  #7eccc4;
    --today-num-fg:  #1a2f3a;
    --time-bg:       #f2faf9;
    --time-fg:       #6aa8a4;
    --time-bdr:      #c8e6e3;
    --time-hl-bg:    #b2deda;
    --time-hl-fg:    #1a4a46;
    --cell-bdr:      #a4d4ce;
    --cell-wknd:     #f5fcfb;
    --cell-hl:       #eaf6f4;
    --cell-cross:    #c8eeea;
    --cell-whl:      #ddf2ee;
    --cell-wcross:   #b8e8e2;
    --surface:       #ffffff;
    --surface-inp:   #f8fdfc;
    --body-text:     #1a2f3a;
    --muted:         #90b8b4;
    --border:        #c8e6e3;
    --ui-text:       #2c3e50;
    --btn-bg:        #2c3e50;
    --btn-hover:     #3d5166;
    --btn-fg:        #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--page-bg);
    color: var(--body-text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ══════════ HEADER ══════════ */
  header {
    background: var(--hdr-bg);
    border-bottom: none;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  header h1 {
    font-size: 1rem; font-weight: 700; color: #fff; flex: 1;
    text-transform: uppercase; letter-spacing: .1em;
  }

  .nav-btn {
    background: none; border: 1px solid rgba(255,255,255,.3); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: .88rem; color: #fff;
    transition: background .15s; white-space: nowrap;
  }
  .nav-btn:hover { background: rgba(255,255,255,.12); }

  .today-btn {
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 6px;
    padding: 6px 14px; cursor: pointer; font-size: .88rem; font-weight: 700;
    white-space: nowrap; transition: background .15s;
  }
  .today-btn:hover { background: var(--accent-dk); }

  .icon-btn {
    background: none; border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font-size: .82rem; color: rgba(255,255,255,.75);
    transition: background .15s; white-space: nowrap;
  }
  .icon-btn:hover { background: rgba(255,255,255,.12); color: #fff; }

  /* ── Week picker ── */
  .week-picker-wrap { position: relative; }
  .week-label-btn {
    background: var(--accent-20); border: 1px solid var(--accent-50); border-radius: 8px;
    padding: 6px 14px; cursor: pointer; display: flex; align-items: center;
    gap: 6px; font-size: .95rem; font-weight: 600; color: #fff;
    min-width: 210px; justify-content: center; transition: background .15s;
  }
  .week-label-btn:hover { background: var(--accent-50); }
  .week-label-btn .wp-arrow { font-size: .75rem; opacity: .7; }

  .week-picker-popup {
    display: none; position: absolute; top: calc(100% + 8px); left: 50%;
    transform: translateX(-50%); background: var(--surface); border: 1px solid var(--accent-md);
    border-radius: 12px; box-shadow: 0 12px 40px rgba(44,62,80,.2);
    padding: 16px; z-index: 500; width: 260px;
  }
  .week-picker-popup.open { display: block; }

  .wp-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .wp-top span { font-weight: 700; font-size: .88rem; color: var(--ui-text); }
  .wp-nav-btn {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    width: 26px; height: 26px; cursor: pointer; font-size: .85rem; color: var(--ui-text);
    display: flex; align-items: center; justify-content: center;
  }
  .wp-nav-btn:hover { background: var(--accent-lt); }

  .wp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .wp-th {
    text-align: center; font-size: .62rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; padding: 2px 0 6px;
  }
  .wp-day, .wp-blank {
    text-align: center; font-size: .8rem; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; cursor: pointer; color: var(--ui-text); transition: background .1s;
  }
  .wp-blank { cursor: default; }
  .wp-day:hover               { background: var(--cell-cross); }
  .wp-day.wp-week-hover       { background: var(--cell-cross); }
  .wp-day.wp-in-selected-week { background: var(--accent-lt); }
  .wp-day.wp-today            { font-weight: 700; color: var(--accent); }
  .wp-day.wp-today.wp-in-selected-week { color: var(--accent); }

  /* ══════════ FILE STORAGE BANNER ══════════ */
  #fsBanner {
    background: #fef9ec; border-bottom: 2px solid #f6c843;
    padding: 7px 20px; display: none; align-items: center; gap: 10px;
    font-size: .82rem; color: #7a5a10; flex-shrink: 0;
  }
  #fsBanner.show { display: flex; }
  #fsBannerMsg { flex: 1; }
  #fsBannerBtn {
    background: var(--btn-bg); color: var(--btn-fg); border: none; border-radius: 6px;
    padding: 5px 14px; cursor: pointer; font-size: .82rem; font-weight: 600;
    white-space: nowrap;
  }
  #fsBannerBtn:hover { background: var(--btn-hover); }
  #fsBannerClose {
    background: none; border: none; cursor: pointer; color: #7a5a10;
    font-size: 1rem; padding: 2px 4px; border-radius: 3px; flex-shrink: 0;
  }
  #fsBannerClose:hover { background: #fdeaa0; }

  /* ══════════ MAIN CONTENT ══════════ */
  #main-content { flex: 1; display: flex; min-height: 0; overflow: hidden; }

  /* ══════════ SIDEBAR ══════════ */
  #sidebar {
    width: 264px; min-width: 160px; max-width: 520px; flex-shrink: 0;
    background: var(--surface); border-right: none;
    display: flex; flex-direction: column; overflow: hidden;
    padding: 18px 14px 14px;
    box-shadow: 2px 0 8px rgba(44,62,80,.08);
  }

  #sidebarResizeHandle {
    width: 6px; flex-shrink: 0; cursor: col-resize;
    background: transparent; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  #sidebarResizeHandle:hover,
  #sidebarResizeHandle.dragging { background: var(--accent); }
  .srh-grip {
    width: 2px; height: 40px; border-radius: 2px;
    background: var(--border); pointer-events: none;
    transition: background .15s;
  }
  #sidebarResizeHandle:hover .srh-grip,
  #sidebarResizeHandle.dragging .srh-grip { background: #fff; }

  .prio-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
  .prio-top h2 {
    font-size: .72rem; font-weight: 700; color: var(--ui-text);
    text-transform: uppercase; letter-spacing: .1em;
  }
  .prio-week-range { font-size: .68rem; color: var(--muted); font-weight: 500; }

  .prio-list {
    list-style: none; display: flex; flex-direction: column;
    gap: 2px; flex: 1; overflow-y: auto; min-height: 0; margin-bottom: 10px;
  }
  .prio-list::-webkit-scrollbar { width: 3px; }
  .prio-list::-webkit-scrollbar-thumb { background: var(--accent-md); border-radius: 2px; }

  .prio-empty { font-size: .8rem; color: var(--muted); padding: 2px 0; }

  .prio-item {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 6px 4px 4px; border-radius: 6px;
    transition: background .1s; min-height: 28px;
  }
  .prio-item:hover { background: var(--accent-lt); }
  .prio-item.done .prio-text { text-decoration: line-through; color: var(--muted); }

  .prio-check { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
  .prio-item.done .prio-check { accent-color: #22c55e; }

  .prio-badge {
    background: var(--accent-lt); border: 1px solid var(--accent-md); border-radius: 12px;
    padding: 1px 7px; font-size: .72rem; font-weight: 700; color: var(--accent);
    cursor: pointer; flex-shrink: 0; transition: background .15s;
    white-space: nowrap; line-height: 1.6;
  }
  .prio-badge:hover    { background: var(--cell-cross); }
  .prio-badge.complete { background: #dcfce7; border-color: #86efac; color: #16a34a; }

  .prio-text {
    font-size: .82rem; color: var(--body-text); flex: 1; overflow: hidden;
    cursor: pointer; border-radius: 3px; padding: 1px 3px; transition: color .12s, background .12s;
  }
  .prio-text:hover { color: var(--accent); background: var(--accent-lt); }
  .prio-notes-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0; margin-right: 1px;
    title: 'Has notes';
  }

  .prio-edit-row { display: flex; align-items: center; gap: 5px; padding: 3px 4px; width: 100%; }
  .prio-edit-row input[type="text"] {
    flex: 1; border: 1px solid var(--accent-md); border-radius: 5px;
    padding: 3px 7px; font-size: .82rem; outline: none; background: var(--surface); color: var(--body-text);
  }
  .prio-edit-row input[type="text"]:focus { border-color: var(--btn-bg); }
  .prio-edit-row input[type="number"] {
    width: 52px; border: 1px solid var(--accent-md); border-radius: 5px;
    padding: 3px 5px; font-size: .82rem; text-align: center; outline: none; background: var(--surface); color: var(--body-text);
  }
  .prio-edit-row input[type="number"]:focus { border-color: var(--btn-bg); }
  .prio-edit-row .edit-label { font-size: .72rem; color: var(--muted); white-space: nowrap; }

  .prio-btn {
    background: none; border: none; cursor: pointer; padding: 2px 4px;
    font-size: .78rem; line-height: 1; border-radius: 3px; flex-shrink: 0; transition: background .1s;
  }
  .prio-save-btn { color: var(--accent); }
  .prio-save-btn:hover { background: var(--accent-lt); }
  .prio-cancel-btn { color: var(--muted); }
  .prio-cancel-btn:hover { background: var(--accent-lt); }
  .prio-edit-btn { color: var(--muted); font-size: .82rem; }
  .prio-edit-btn:hover { color: var(--ui-text); background: var(--accent-lt); }
  .prio-del-btn { color: var(--muted); font-size: .78rem; }
  .prio-del-btn:hover { color: #e05252; background: #fff0f0; }

  .prio-add-section { flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; }
  .prio-add-section > input[type="text"] {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; font-size: .82rem; outline: none; transition: border .15s;
    background: var(--surface); color: var(--body-text);
  }
  .prio-add-section > input[type="text"]:focus { border-color: var(--btn-bg); }
  .prio-add-sub { display: flex; align-items: center; gap: 5px; }
  .prio-add-sub .add-sub-label { font-size: .7rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .prio-add-sub input[type="number"] {
    width: 52px; border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 6px; font-size: .82rem; text-align: center; outline: none;
    transition: border .15s; flex-shrink: 0; background: var(--surface); color: var(--body-text);
  }
  .prio-add-sub input[type="number"]:focus { border-color: var(--btn-bg); }
  .prio-add-btn {
    flex: 1; background: var(--btn-bg); color: var(--btn-fg); border: none; border-radius: 6px;
    padding: 5px 8px; cursor: pointer; font-size: .82rem; font-weight: 600;
  }
  .prio-add-btn:hover { background: var(--btn-hover); }

  .legend-edit-btn {
    background: none; border: none; cursor: pointer;
    font-size: .72rem; color: var(--accent); padding: 2px 7px;
    border-radius: 4px; transition: background .1s, color .1s;
  }
  .legend-edit-btn:hover { background: var(--accent-lt); color: var(--ui-text); }

  #prioPanel {
    display: flex; flex-direction: column; flex-shrink: 0;
    height: 240px; min-height: 80px; overflow: hidden;
  }

  #sbVResizeHandle {
    height: 7px; flex-shrink: 0; cursor: row-resize;
    background: transparent; position: relative;
    display: flex; align-items: center; justify-content: center;
    margin: 2px 0; transition: background .15s;
  }
  #sbVResizeHandle:hover,
  #sbVResizeHandle.dragging { background: var(--accent-20); border-radius: 4px; }
  .sbvh-grip {
    width: 36px; height: 2px; border-radius: 2px;
    background: var(--border); pointer-events: none;
    transition: background .15s;
  }
  #sbVResizeHandle:hover .sbvh-grip,
  #sbVResizeHandle.dragging .sbvh-grip { background: var(--accent); }

  /* ══════════ CALENDAR WRAPPER ══════════ */
  #calendar-wrapper {
    flex: 1; overflow: auto; padding: 14px; min-height: 0; min-width: 0;
  }
  #calendar {
    display: grid; border: none; border-radius: 12px;
    background: var(--surface); box-shadow: 0 4px 24px rgba(44,62,80,.14); width: 100%;
    position: relative;
  }

  /* ── Current time indicator ── */
  .time-now-line {
    position: absolute; left: 76px; right: 0; height: 2px;
    background: #e05252; z-index: 25; pointer-events: none;
  }
  .time-now-line::before {
    content: ''; position: absolute; left: -5px; top: -4px;
    width: 10px; height: 10px; border-radius: 50%; background: #e05252;
  }

  /* ── Corner ── */
  .corner-cell {
    background: var(--hdr-bg);
    border-right: 2px solid var(--hdr-dk);
    border-bottom: 2px solid var(--hdr-dk);
    position: sticky; left: 0; top: 0; z-index: 30;
  }

  /* ── Day headers ── */
  .day-header {
    background: linear-gradient(180deg, var(--day-a) 0%, var(--day-b) 100%);
    border-bottom: 2px solid var(--day-bdr); border-right: 1px solid var(--day-b);
    padding: 10px 6px 8px; text-align: center; user-select: none;
    position: sticky; top: 0; z-index: 15; transition: background .12s;
  }
  .day-header .day-name {
    font-size: .65rem; color: rgba(255,255,255,.85); text-transform: uppercase;
    letter-spacing: .1em; font-weight: 700;
  }
  .day-header .day-num {
    font-size: 1.8rem; font-weight: 700; line-height: 1.1; margin: 3px 0 2px; color: #fff;
  }
  .day-header .day-mon { font-size: .65rem; color: rgba(255,255,255,.7); letter-spacing: .05em; font-weight: 500; }

  .day-header.today-col { background: linear-gradient(180deg, var(--today-a) 0%, var(--today-b) 100%); border-bottom-color: var(--today-a); }
  .day-header.today-col .day-num {
    background: var(--today-num-bg); color: var(--today-num-fg); border-radius: 50%;
    width: 40px; height: 40px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 1.4rem;
  }
  .day-header.weekend { background: linear-gradient(180deg, var(--wknd-a) 0%, var(--wknd-b) 100%); border-right-color: var(--wknd-b); }
  .day-header.weekend .day-name { color: rgba(255,255,255,.9); }
  .day-header.weekend .day-num  { color: #fff; }
  .day-header.hl { background: var(--day-bdr) !important; }
  .day-header.stat-holiday { border-bottom: 2px solid rgba(210,45,45,.7); }
  .day-header .allday-strip {
    display: flex; flex-direction: column; gap: 2px;
    margin-top: 4px; padding: 0 2px;
  }
  .ev-allday {
    font-size: .6rem; font-weight: 700; border-radius: 3px;
    padding: 2px 5px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 3px;
  }
  .ev-allday .ev-del { opacity: 0; font-size: .65rem; line-height: 1; flex-shrink: 0; }
  .ev-allday:hover .ev-del { opacity: 1; }

  .allday-row { margin-bottom: 2px; }
  .allday-label { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
  .allday-label input { cursor: pointer; }

  .day-header .day-holiday-lbl {
    font-size: .52rem; font-weight: 700; letter-spacing: .02em;
    color: #fff; background: rgba(195,40,40,.55);
    border-radius: 3px; padding: 1px 4px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: calc(100% - 8px);
  }

  /* ── Time labels ── */
  .time-label {
    background: var(--time-bg); border-right: 2px solid var(--time-bdr);
    border-bottom: 1px solid var(--cell-bdr); padding: 0 10px;
    font-size: .72rem; color: var(--time-fg); text-align: right; height: 44px;
    display: flex; align-items: center; justify-content: flex-end;
    position: sticky; left: 0; z-index: 10; white-space: nowrap;
    min-width: 76px; transition: background .12s, color .12s;
  }
  .time-label.half-hour { font-size: .64rem; color: var(--muted); border-bottom: 1px dashed var(--cell-bdr); }
  .time-label.hl { background: var(--time-hl-bg) !important; color: var(--time-hl-fg) !important; font-weight: 700; }

  /* ── Day cells ── */
  .day-cell {
    border-right: 1px solid var(--cell-bdr); border-bottom: 1px solid var(--cell-bdr);
    height: 44px; position: relative; cursor: pointer;
  }
  .day-cell.half-hour { border-bottom: 1px dashed var(--cell-bdr); }
  .day-cell.weekend   { background: var(--cell-wknd); }
  .day-cell.row-hl              { background: var(--cell-hl); }
  .day-cell.col-hl              { background: var(--cell-hl); }
  .day-cell.row-hl.col-hl       { background: var(--cell-cross); }
  .day-cell.weekend.row-hl,
  .day-cell.weekend.col-hl      { background: var(--cell-whl); }
  .day-cell.weekend.row-hl.col-hl { background: var(--cell-wcross); }
  .day-cell.drag-over { background: var(--accent) !important; opacity: .6; }
  .drag-time-lbl {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #e74c3c; font-size: .8rem; font-weight: 700;
    pointer-events: none; z-index: 7; letter-spacing: .02em;
  }

  /* ── Events ── */
  .event {
    position: absolute; left: 4px; right: 4px; top: 4px;
    border-radius: 6px; padding: 4px 8px;
    font-size: .75rem; font-weight: 600; cursor: grab;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overflow: hidden; z-index: 6;
    box-shadow: 0 2px 6px rgba(0,0,0,.12); line-height: 1.4;
  }
  .event * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .event:active { cursor: grabbing; }
  .event .ev-del {
    position: absolute; top: 3px; right: 5px; opacity: 0;
    font-size: .8rem; line-height: 1; cursor: pointer; transition: opacity .1s;
  }
  .event:hover .ev-del { opacity: .85; }
  .event .ev-del:hover  { opacity: 1; }
  .event .ev-text  { display: block; overflow: hidden; padding-right: 14px; }
  .event .ev-title { font-weight: 700; overflow: hidden; padding-right: 14px; display: block; }
  .event .ev-time  { font-size: .68rem; font-weight: 500; opacity: .8; margin-top: 2px; display: block; }
  .event .ev-recur { font-size: .65rem; opacity: .7; margin-top: 1px; display: block; }
  .ev-location { font-size: .65rem; margin-top: 2px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-location a { color: inherit; text-decoration: none; opacity: .85; display: inline-flex; align-items: center; gap: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .ev-location a:hover { opacity: 1; text-decoration: underline; }
  .ev-location svg { flex-shrink: 0; }

  .loc-input-wrap { position: relative; }
  .loc-input-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--accent); }
  .loc-input-wrap input { padding-left: 30px !important; }
  .event.ev-overnight { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 2px dashed rgba(0,0,0,.18); }
  .event.ev-cont      { border-top-left-radius: 0; border-top-right-radius: 0; border-top: 2px dashed rgba(0,0,0,.18); }
  .ev-resize {
    position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 4px; border-radius: 2px; cursor: ns-resize;
    background: rgba(0,0,0,.18); opacity: 0; transition: opacity .15s;
  }
  .event:hover .ev-resize { opacity: 1; }
  .event.is-resizing { opacity: .85; }
  body.ev-dragging .event { pointer-events: none; }
  /* Event being moved via long-press on touch: lighten + lift so it's clearly "picked up" */
  .event.ev-moving {
    opacity: .55; outline: 2px dashed rgba(255,255,255,.9);
    outline-offset: -2px; transform: scale(1.04);
    box-shadow: 0 6px 18px rgba(0,0,0,.28); z-index: 50;
    pointer-events: auto !important;
  }

  /* ══════════ MODALS ══════════ */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(30,50,60,.5); z-index: 600;
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--surface); border-radius: 14px; padding: 18px 24px;
    width: 420px; box-shadow: 0 16px 48px rgba(44,62,80,.25);
    max-height: 92vh; overflow-y: auto;
  }
  .modal.narrow { width: 320px; }
  .modal.wide   { width: 480px; }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }

  /* Compact side-by-side field layout (desktop) so the event modal fits without scrolling */
  #evDateTimeRow { display: flex; gap: 12px; align-items: flex-start; }
  #evDateCol { flex: 1; min-width: 0; }
  #evTimeRows { flex: 1.4; min-width: 0; }
  #evTimeCols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #evTimeCols > div { min-width: 0; }
  .modal-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
  .modal h2 {
    font-size: 1rem; margin-bottom: 0; color: var(--ui-text);
    font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  }
  .modal-close-btn {
    background: none; border: none; cursor: pointer;
    font-size: 1rem; color: var(--muted); line-height: 1;
    padding: 4px 6px; border-radius: 6px; transition: background .12s, color .12s;
    flex-shrink: 0;
  }
  .modal-close-btn:hover { background: #fee2e2; color: #e05252; }
  .modal label {
    font-size: .78rem; font-weight: 700; color: var(--ui-text);
    display: block; margin-bottom: 3px; margin-top: 8px;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .modal input[type="text"],
  .modal input[type="date"],
  .modal input[type="number"],
  .modal select,
  .modal textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: .88rem; outline: none; transition: border .15s;
    background: var(--surface-inp); color: var(--body-text);
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--btn-bg); background: var(--surface); }
  .modal textarea { resize: vertical; min-height: 40px; }
  .modal .hint { font-size: .74rem; color: var(--muted); margin-top: 3px; }

  .color-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color .15s, transform .1s;
  }
  .color-swatch:hover    { transform: scale(1.15); }
  .color-swatch.selected { border-color: var(--ui-text); }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn-cancel {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 16px; cursor: pointer; font-size: .88rem; color: var(--muted);
  }
  .btn-cancel:hover { background: var(--accent-lt); }
  .btn-save {
    background: var(--btn-bg); color: var(--btn-fg); border: none; border-radius: 8px;
    padding: 7px 18px; cursor: pointer; font-size: .88rem; font-weight: 600;
  }
  .btn-save:hover { background: var(--btn-hover); }
  .btn-danger {
    background: #c0392b; color: #fff; border: none; border-radius: 8px;
    padding: 7px 16px; cursor: pointer; font-size: .88rem; font-weight: 600;
  }
  .btn-danger:hover { background: #a93226; }

  .cl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .cl-row  { display: flex; align-items: center; gap: 8px; }
  .cl-dot  { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
  .cl-grid input[type="text"] {
    flex: 1; border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 8px; font-size: .82rem; outline: none; background: var(--surface); color: var(--body-text);
  }
  .cl-grid input[type="text"]:focus { border-color: var(--btn-bg); }
  .cl-color-pick {
    width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 6px;
    padding: 2px; cursor: pointer; flex-shrink: 0;
  }

  .prog-target-hint { font-size: .78rem; color: var(--accent); margin-top: 4px; font-weight: 600; }
  .prog-stepper { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .prog-stepper button {
    background: var(--accent-lt); border: 1px solid var(--accent-md); border-radius: 6px;
    width: 34px; height: 34px; font-size: 1.1rem; cursor: pointer;
    color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .prog-stepper button:hover { background: var(--cell-cross); }
  .prog-stepper input {
    width: 70px !important; text-align: center; font-size: 1.1rem !important;
    font-weight: 700; color: var(--body-text);
  }

  .dur-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; max-width: 200px; }
  .dur-row input[type="number"] { width: 60px !important; }
  .dur-row select { flex: 1; }
  .dur-lbl { font-size: .82rem; color: var(--time-fg); }

  #evRecurEndRow { display: none; }

  #calendar-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
  #calendar-wrapper::-webkit-scrollbar-track { background: var(--page-bg); }
  #calendar-wrapper::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

  /* ══════════ WEEK SUMMARY CHART ══════════ */
  .chart-section {
    flex: 1; min-height: 60px; display: flex; flex-direction: column; overflow: hidden;
  }
  .chart-section-hdr {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; margin-bottom: 6px;
  }
  .chart-section-hdr > span {
    font-size: .72rem; font-weight: 700; color: var(--ui-text);
    text-transform: uppercase; letter-spacing: .1em;
  }
  #chartContent { flex: 1; overflow-y: auto; min-height: 0; }
  #chartContent::-webkit-scrollbar { width: 3px; }
  #chartContent::-webkit-scrollbar-thumb { background: var(--accent-md); border-radius: 2px; }
  .chart-donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .chart-legend { width: 100%; display: flex; flex-direction: column; gap: 3px; }
  .chart-legend-item {
    display: flex; align-items: center; gap: 6px; font-size: .72rem;
  }
  .chart-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chart-lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--body-text); }
  .chart-val { color: var(--ui-text); font-weight: 600; white-space: nowrap; }
  .chart-pct { color: var(--muted); font-weight: 400; }
  .chart-empty { font-size: .72rem; color: var(--muted); padding: 6px 0; }

  /* ══════════ THEME SWITCHER ══════════ */
  .theme-picker-wrap { position: relative; }
  .theme-dropdown {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
    padding: 5px; z-index: 500; min-width: 160px;
  }
  .theme-dropdown.open { display: block; }
  .theme-opt {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 10px; border: none; background: none; cursor: pointer;
    border-radius: 6px; font-size: .85rem; color: var(--ui-text);
    text-align: left; transition: background .1s; white-space: nowrap;
  }
  .theme-opt:hover { background: var(--accent-lt); }
  .theme-opt.active { font-weight: 700; }
  .theme-swatch {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid rgba(0,0,0,.15);
  }

  /* ══════════ MOBILE ══════════ */
  @media (max-width: 768px) {
    /* Bounded height so the calendar scrolls internally and day headers stay sticky */
    body { overflow: hidden; height: 100vh; height: 100dvh; }

    header {
      flex-wrap: wrap; padding: 8px 12px; gap: 6px;
    }
    header h1 { order: -1; flex-basis: 100%; font-size: .85rem; }
    .week-picker-wrap { order: 1; flex: 1; }
    .week-label-btn { min-width: unset; font-size: .82rem; padding: 6px 10px; width: 100%; }
    #prevBtn, #nextBtn { padding: 6px 10px; font-size: .88rem; }
    .today-btn { padding: 6px 10px; font-size: .82rem; }
    #notifyBtn, #folderBtn, .theme-picker-wrap { display: none; }
    #sidebarToggleBtn {
      display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid rgba(255,255,255,.3); border-radius: 6px;
      padding: 6px 10px; cursor: pointer; font-size: 1rem; color: #fff;
    }

    #main-content { flex-direction: column; overflow: hidden; flex: 1; min-height: 0; }

    #sidebar {
      display: none; width: 100%; max-width: 100%; min-width: unset;
      box-shadow: 0 4px 12px rgba(44,62,80,.15); border-bottom: 1px solid var(--border);
      padding: 14px 14px 10px;
    }
    #sidebar.mobile-open { display: flex; }
    #sidebarResizeHandle { display: none; }
    #sbVResizeHandle { display: none; }
    #prioPanel { height: auto; max-height: 260px; }

    #calendar-wrapper {
      padding: 8px; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    #calendar { border-radius: 8px; width: max-content; min-width: 100%; }

    .time-now-line { left: 60px; }
    .corner-cell { width: 60px; }
    .time-label { width: 60px; font-size: .65rem; }

    .day-cell { min-height: 44px; }
    .ev-del { display: none !important; }

    /* ── Centered floating modal ── */
    .modal-backdrop {
      align-items: center; justify-content: center; padding: 0;
      /* Use dynamic viewport units so iOS Safari sizes to the VISIBLE area
         (vh/vw include space behind the toolbars and don't settle until a resize) */
      height: 100vh; height: 100dvh;
      width: 100vw; width: 100dvw;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: calc(100vw - 32px); width: calc(100dvw - 32px); max-width: 380px; border-radius: 14px;
      padding: 12px 14px 16px; max-height: 86vh; max-height: 86dvh; overflow-y: auto;
      box-shadow: 0 8px 32px rgba(44,62,80,.35);
    }
    .modal::before { display: none; }
    .modal.narrow, .modal.wide { width: calc(100vw - 32px); width: calc(100dvw - 32px); max-width: 380px; }
    .modal h2 { font-size: .82rem; }
    .modal-header { margin-bottom: 6px; }
    .modal label { display: block; margin-top: 6px; margin-bottom: 2px; font-size: .67rem; }
    .modal input[type="text"],
    .modal input[type="date"],
    .modal input[type="number"],
    .modal select { font-size: .84rem; padding: 5px 8px; width: 100%; box-sizing: border-box; }
    .modal textarea { font-size: .84rem; padding: 5px 8px; min-height: 32px; width: 100%; box-sizing: border-box; }
    .modal .hint { font-size: .64rem; margin-top: 1px; }
    /* Date full-width, then Start | End side by side */
    #evDateTimeRow { display: block; margin-top: 4px; }
    #evDateCol { margin-bottom: 4px; }
    #evTimeRows { display: block; }
    #evTimeCols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #evTimeCols > div { min-width: 0; }
    .modal-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
    .modal-2col label { margin-top: 6px; }
    .allday-row { margin-top: 6px; }
    .allday-label { font-size: .78rem; }
    /* Hide less-used fields on mobile */
    .ev-desktop-only, .ev-location-wrap, .ev-notes-wrap, .ev-color-label, #colorLegendHint { display: none; }
    .ev-dur-wrap { display: none; }
    .modal-actions { gap: 8px; margin-top: 10px; }
    .modal-actions .btn-cancel,
    .modal-actions .btn-save,
    .modal-actions .btn-danger { flex: 1; padding: 9px; font-size: .88rem; }
    .color-row { gap: 6px; margin-top: 6px; }
    .color-swatch { width: 22px; height: 22px; }

    .week-picker-popup { width: 92vw; left: 0; transform: none; }
  }
  @media (min-width: 769px) {
    #sidebarToggleBtn { display: none; }
  }
</style>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ══ Header ══ -->
<header>
  <button class="nav-btn" id="prevBtn">&#8249; Prev</button>

  <div class="week-picker-wrap" id="weekPickerWrap">
    <button class="week-label-btn" id="weekLabelBtn">
      <span id="weekLabel"></span><span class="wp-arrow">▾</span>
    </button>
    <div class="week-picker-popup" id="weekPickerPopup">
      <div class="wp-top">
        <button class="wp-nav-btn" id="wpPrevMonth">&#8249;</button>
        <span id="wpMonthLabel"></span>
        <button class="wp-nav-btn" id="wpNextMonth">&#8250;</button>
      </div>
      <div class="wp-grid" id="wpGrid"></div>
    </div>
  </div>

  <button class="nav-btn" id="nextBtn">Next &#8250;</button>
  <button class="today-btn" id="todayBtn">Today</button>
  <button id="sidebarToggleBtn" title="Toggle priorities">☰</button>
  <button class="icon-btn" id="notifyBtn" title="Click to enable event reminders">🔔 Alerts</button>
  <button class="icon-btn" id="folderBtn" title="Select folder to save data across browsers">📁 Select Folder</button>
  <button class="icon-btn" id="syncBtn" title="Sign in to sync across devices">☁️ Sign In</button>
  <div class="theme-picker-wrap" id="themePickerWrap">
    <button class="icon-btn" id="themeBtn">🎨 Theme</button>
    <div class="theme-dropdown" id="themeDropdown">
      <button class="theme-opt" data-theme="professional"><span class="theme-swatch" style="background:#7eccc4"></span>Professional</button>
      <button class="theme-opt" data-theme="dark"><span class="theme-swatch" style="background:#1a2744"></span>Dark</button>
      <button class="theme-opt" data-theme="pink"><span class="theme-swatch" style="background:#e8789a"></span>Pink</button>
      <button class="theme-opt" data-theme="blue"><span class="theme-swatch" style="background:#4a90d9"></span>Blue</button>
    </div>
  </div>
  <h1>Daily Planner</h1>
</header>

<!-- ══ File storage banner ══ -->
<div id="fsBanner">
  <span id="fsBannerMsg"></span>
  <button id="fsBannerBtn"></button>
  <button id="fsBannerClose" title="Dismiss">✕</button>
</div>

<!-- ══ Main content (sidebar + calendar) ══ -->
<div id="main-content">

  <!-- Sidebar: Week Priorities -->
  <aside id="sidebar">
    <div id="prioPanel">
      <div class="prio-top">
        <h2>Week Priorities</h2>
        <span class="prio-week-range" id="prioWeekRange"></span>
      </div>
      <ul class="prio-list" id="prioritiesList"></ul>
      <div class="prio-add-section">
        <input type="text" id="priorityInput" placeholder="Add a priority for this week…" />
        <div class="prio-add-sub">
          <span class="add-sub-label">Goal (opt)</span>
          <input type="number" id="priorityTarget" placeholder="3" min="1" />
          <button class="prio-add-btn" id="priorityAddBtn">+ Add</button>
        </div>
      </div>
    </div>
    <div id="sbVResizeHandle"><div class="sbvh-grip"></div></div>
    <div class="chart-section" id="weekChartSection">
      <div class="chart-section-hdr">
        <span>Week Summary</span>
        <button id="openColorsBtn" class="legend-edit-btn">✏️ Define Colors</button>
      </div>
      <div id="chartContent"></div>
    </div>
  </aside>

  <div id="sidebarResizeHandle"><div class="srh-grip"></div></div>

  <!-- Calendar -->
  <div id="calendar-wrapper">
    <div id="calendar"></div>
  </div>

</div>

<!-- ══ Event Modal ══ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Event</h2>
      <button class="modal-close-btn" id="modalCloseBtn" title="Cancel &amp; close">✕</button>
    </div>
    <label class="ev-desktop-only">Event Title</label>
    <input type="text" id="evTitle" placeholder="Event title" />
    <div id="evDateTimeRow">
      <div id="evDateCol">
        <label>Date</label>
        <input type="date" id="evDate" />
      </div>
      <div id="evTimeRows">
        <div id="evTimeCols">
          <div>
            <label>Start</label>
            <select id="evStart"></select>
          </div>
          <div>
            <label>End</label>
            <select id="evEnd"></select>
          </div>
        </div>
      </div><!-- #evTimeRows -->
    </div><!-- #evDateTimeRow -->
    <div class="ev-dur-wrap">
      <label class="ev-dur-label">Duration</label>
      <div class="dur-row ev-dur-row">
        <input type="number" id="evDurH" min="0" max="47" placeholder="0" />
        <span class="dur-lbl">h</span>
        <select id="evDurM">
          <option value="0">00 min</option>
          <option value="30">30 min</option>
        </select>
      </div>
    </div>
    <div class="allday-row">
      <label class="allday-label"><input type="checkbox" id="evAllDay"> All day</label>
    </div>
    <div class="ev-location-wrap">
      <label>Location</label>
      <div class="loc-input-wrap">
        <svg width="12" height="15" viewBox="0 0 12 15" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6 0C3.243 0 1 2.243 1 5c0 4.2 5 10 5 10s5-5.8 5-10c0-2.757-2.243-5-5-5zm0 7.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
        <input type="text" id="evLocation" placeholder="Address or place name (optional)" />
      </div>
    </div>
    <div class="modal-2col">
      <div>
        <label>Repeat</label>
        <select id="evRecurrence">
          <option value="none">Does not repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly (same day)</option>
          <option value="weekdays">Every weekday (Mon–Fri)</option>
          <option value="weekends">Weekends (Sat–Sun)</option>
        </select>
      </div>
      <div>
        <label>Reminder (min)</label>
        <input type="number" id="evReminderMin" min="0" max="1440" value="15" />
      </div>
    </div>
    <div id="evRecurEndRow">
      <label>Ends on</label>
      <input type="date" id="evRecurEnd" />
      <p class="hint">Leave blank to repeat for 6 months.</p>
    </div>
    <div class="ev-notes-wrap">
      <label>Notes</label>
      <textarea id="evNotes" placeholder="Optional notes…"></textarea>
    </div>
    <label class="ev-color-label">Color</label>
    <div class="color-row" id="colorRow"></div>
    <div id="colorLegendHint" style="font-size:.74rem;color:#a0aec0;margin-top:4px;"></div>
    <div class="modal-actions">
      <button class="btn-danger" id="modalDelete" style="display:none;margin-right:auto">Delete</button>
      <button class="btn-cancel" id="modalCancel">Cancel</button>
      <button class="btn-save"   id="modalSave">Save</button>
    </div>
  </div>
</div>

<!-- ══ Recur Delete/Edit Choice Modal ══ -->
<div class="modal-backdrop" id="recurModalBackdrop">
  <div class="modal narrow">
    <h2 id="recurModalTitle">Recurring Event</h2>
    <p id="recurModalMsg" style="font-size:.88rem;color:#4a5568;line-height:1.5;"></p>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="btn-cancel" id="recurCancelBtn">Cancel</button>
      <div style="display:flex;gap:8px;">
        <button class="btn-cancel" id="recurThisBtn">This event only</button>
        <button class="btn-danger" id="recurAllBtn">All occurrences</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ Priority Notes Modal ══ -->
<div class="modal-backdrop" id="prioNotesBackdrop">
  <div class="modal">
    <h2 id="prioNotesHeading">Priority Notes</h2>
    <p id="prioNotesSubtitle" style="font-size:.82rem;color:#6aa8a4;margin-bottom:4px;font-style:italic;"></p>
    <label style="margin-top:8px;">Notes &amp; Details</label>
    <textarea id="prioNotesText" placeholder="Add notes, sub-tasks, links, or any context for this priority…" style="min-height:150px;"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="prioNotesCancelBtn">Cancel</button>
      <button class="btn-save"   id="prioNotesSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ══ Progress Modal ══ -->
<div class="modal-backdrop" id="progressModalBackdrop">
  <div class="modal narrow">
    <h2>Update Progress</h2>
    <p id="progItemLabel" style="font-size:.88rem;color:#4a5568;margin-bottom:4px;"></p>
    <p class="prog-target-hint" id="progTargetHint"></p>
    <div class="prog-stepper">
      <button id="progDecBtn">−</button>
      <input type="number" id="progValueInput" min="0" />
      <button id="progIncBtn">+</button>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="progCancelBtn">Cancel</button>
      <button class="btn-save"   id="progSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ══ Color Legend Modal ══ -->
<div class="modal-backdrop" id="colorLegendBackdrop">
  <div class="modal wide">
    <h2>Define Event Colors</h2>
    <p style="font-size:.82rem;color:#718096;">Give each color a label so your calendar is easy to read.</p>
    <div class="cl-grid" id="clGrid"></div>
    <div class="modal-actions">
      <button class="btn-save" id="colorLegendSave">Done</button>
    </div>
  </div>
</div>

<script>
// ══ Constants ════════════════════════════════════════════
const HOURS        = Array.from({length: 48}, (_, i) => i * 0.5);
const DAYS_SHORT   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function tintColor(hex, t) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const ch = c => Math.round(c+(255-c)*t).toString(16).padStart(2,'0');
  return `#${ch(r)}${ch(g)}${ch(b)}`;
}
function shadeColor(hex, s) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const ch = c => Math.round(c*(1-s)).toString(16).padStart(2,'0');
  return `#${ch(r)}${ch(g)}${ch(b)}`;
}
function colorFromBase(hex) {
  return { bg: tintColor(hex,0.65), text: shadeColor(hex,0.42), border: tintColor(hex,0.35), dot: hex };
}

// ══ Helpers ══════════════════════════════════════════════
function dateStr(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function dateStrFromDate(dt) {
  return dateStr(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function getWeekStart(dt) {
  const d = new Date(dt); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d;
}
function isMobile() { return window.innerWidth <= 768; }
function getWeekDays() {
  return Array.from({length:7}, (_, i) => { const d = new Date(currentWeekStart); d.setDate(d.getDate()+i); return d; });
}
function weekRangeLabel() {
  const end = new Date(currentWeekStart); end.setDate(end.getDate()+6);
  const s = currentWeekStart, e = end;
  if (s.getMonth() === e.getMonth())
    return `${MONTHS_SHORT[s.getMonth()]} ${s.getDate()} – ${e.getDate()}, ${e.getFullYear()}`;
  return `${MONTHS_SHORT[s.getMonth()]} ${s.getDate()} – ${MONTHS_SHORT[e.getMonth()]} ${e.getDate()}, ${e.getFullYear()}`;
}
function formatHour(h) {
  const mins = h%1 !== 0 ? '30' : '00', w = Math.floor(h);
  if (w===0)  return `12:${mins} AM`;
  if (w<12)   return `${w}:${mins} AM`;
  if (w===12) return `12:${mins} PM`;
  if (w<24)   return `${w-12}:${mins} PM`;
  return '12:00 AM';
}
function genId() { return Math.random().toString(36).slice(2,10); }
function formatHourExt(h) {
  if (h <= 24) return formatHour(h);
  return formatHour(h - 24) + ' +1d';
}
function prevDayStr(ds) {
  const d = parseLocalDate(ds); d.setDate(d.getDate() - 1); return dateStrFromDate(d);
}

function rebuildColors() {
  colorBases.forEach((hex, i) => {
    COLORS[i] = hex ? colorFromBase(hex) : {...COLORS_DEFAULT[i]};
  });
}

// ══ File System Storage (File System Access API) ═════════
let fsDir = null;
const FS_IDB = 'plannerFSv1', FS_STORE = 'handles', FS_KEY = 'dataDir';

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(FS_IDB, 1);
    r.onupgradeneeded = e => e.target.result.createObjectStore(FS_STORE);
    r.onsuccess = e => res(e.target.result);
    r.onerror   = rej;
  });
}
async function idbGet() {
  const db = await idbOpen();
  return new Promise(res => {
    const tx = db.transaction(FS_STORE);
    const r  = tx.objectStore(FS_STORE).get(FS_KEY);
    r.onsuccess = e => res(e.target.result || null);
    r.onerror   = () => res(null);
  });
}
async function idbPut(val) {
  const db = await idbOpen();
  return new Promise(res => {
    const tx = db.transaction(FS_STORE, 'readwrite');
    tx.objectStore(FS_STORE).put(val, FS_KEY);
    tx.oncomplete = res;
  });
}

async function readDataFile() {
  if (!fsDir) return null;
  try {
    const fh = await fsDir.getFileHandle('planner-data.json');
    return JSON.parse(await (await fh.getFile()).text());
  } catch { return null; }
}
async function writeDataFile() {
  if (!fsDir) return;
  try {
    const fh = await fsDir.getFileHandle('planner-data.json', {create: true});
    const w  = await fh.createWritable();
    await w.write(JSON.stringify({events, priorities, colorLabels, colorBases}));
    await w.close();
  } catch(e) { console.warn('File write error:', e); }
}

function applyLoadedData(d) {
  if (!d) return;
  if (d.events)      events      = d.events;
  if (d.priorities)  priorities  = d.priorities;
  if (d.colorLabels) colorLabels = d.colorLabels;
  if (d.colorBases)  { colorBases = d.colorBases; rebuildColors(); }
}
function rerender() {
  renderCalendar(); renderPriorities(); renderColorLegendBar(); buildColorPicker();
}

async function connectAndLoad(dirHandle) {
  const perm = await dirHandle.requestPermission({mode: 'readwrite'});
  if (perm !== 'granted') return false;
  fsDir = dirHandle;
  await idbPut(dirHandle);
  const data = await readDataFile();
  if (data) { applyLoadedData(data); rerender(); }
  else writeDataFile(); // migrate any existing localStorage data to file
  document.getElementById('fsBanner').classList.remove('show');
  updateFolderBtn();
  return true;
}

function showFsBanner(mode, existingHandle) {
  const banner = document.getElementById('fsBanner');
  const msg    = document.getElementById('fsBannerMsg');
  const btn    = document.getElementById('fsBannerBtn');
  if (mode === 'reconnect') {
    msg.textContent = 'Click Reconnect to restore your saved data (needed once per browser session).';
    btn.textContent = 'Reconnect data folder';
    btn.onclick = () => connectAndLoad(existingHandle);
  } else {
    msg.textContent = 'Connect your data folder to save data across all browsers. Select: C:\\Users\\John\\daily-planner';
    btn.textContent = 'Connect data folder';
    btn.onclick = async () => {
      try {
        const dir = await window.showDirectoryPicker({mode: 'readwrite'});
        await connectAndLoad(dir);
      } catch {} // user cancelled picker
    };
  }
  document.getElementById('fsBannerClose').onclick = () => banner.classList.remove('show');
  banner.classList.add('show');
}

async function initFileStorage() {
  if (!('showDirectoryPicker' in window)) return false;
  try {
    const stored = await idbGet();
    if (stored) {
      const perm = await stored.queryPermission({mode: 'readwrite'});
      if (perm === 'granted') {
        fsDir = stored;
        const data = await readDataFile();
        applyLoadedData(data);
        return true;
      }
      showFsBanner('reconnect', stored);
    }
    // No stored handle — user picks folder via the header button
  } catch(e) { console.warn('FS init error:', e); }
  return false;
}

function saveAll() {
  localStorage.setItem('plannerEvents',      JSON.stringify(events));
  localStorage.setItem('plannerPriorities',  JSON.stringify(priorities));
  localStorage.setItem('plannerColorLabels', JSON.stringify(colorLabels));

}

function updateNotifyBtn() {
  const btn = document.getElementById('notifyBtn');
  if (!btn) return;
  if (!('Notification' in window)) { btn.style.display = 'none'; return; }
  if (Notification.permission === 'granted') {
    btn.textContent = '🔔 Alerts On';
    btn.title = 'Notifications enabled — click to send a test';
    btn.style.opacity = '1';
  } else if (Notification.permission === 'denied') {
    btn.textContent = '🔕 Alerts Off';
    btn.title = 'Notifications blocked — allow them in browser site settings';
    btn.style.opacity = '.5';
  } else {
    btn.textContent = '🔔 Alerts';

    btn.style.opacity = '1';
  }

function setupNotifyBtn() {
  const btn = document.getElementById('notifyBtn');
  if (!btn || !('Notification' in window)) return;
  btn.addEventListener('click', async () => {

      await Notification.requestPermission();

      new Notification('📅 Daily Planner', { body: 'Reminders are working!', tag: 'test' });
    }
    updateNotifyBtn();
    scheduleNotifications();
  });
}

function applyTheme(name) {
  const root  = document.documentElement;
  const theme = THEMES[name] || {};
  // First reset all vars to :root defaults (teal) by removing inline styles
  Object.keys(THEMES.dark).forEach(k => root.style.removeProperty(k));
  // Then apply chosen theme overrides
  Object.entries(theme).forEach(([k, v]) => root.style.setProperty(k, v));
  localStorage.setItem('plannerTheme', name);
  document.querySelectorAll('.theme-opt').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.theme === name)
  );
}

function setupThemePicker() {
  const btn = document.getElementById('themeBtn');
  const dd  = document.getElementById('themeDropdown');
  btn.addEventListener('click', e => { e.stopPropagation(); dd.classList.toggle('open'); });
  document.addEventListener('click', () => dd.classList.remove('open'));
  dd.querySelectorAll('.theme-opt').forEach(opt =>
    opt.addEventListener('click', () => { applyTheme(opt.dataset.theme); dd.classList.remove('open'); })
  );
  const saved = localStorage.getItem('plannerTheme');
  applyTheme((saved === 'teal' || !saved) ? 'professional' : saved);
}

function setupSidebarResize() {
  const handle  = document.getElementById('sidebarResizeHandle');
  const sidebar = document.getElementById('sidebar');
  let dragging = false, startX = 0, startW = 0;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX   = e.clientX;
    startW   = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor     = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(160, Math.min(520, startW + e.clientX - startX));
    sidebar.style.width = `${w}px`;
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor     = '';
    document.body.style.userSelect = '';
  });
}

function setupSidebarVResize() {
  const handle    = document.getElementById('sbVResizeHandle');
  const prioPanel = document.getElementById('prioPanel');
  let dragging = false, startY = 0, startH = 0;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startY   = e.clientY;
    startH   = prioPanel.offsetHeight;
    handle.classList.add('dragging');

}

function scheduleNotifications() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  Object.values(_notifyTimers).forEach(clearTimeout);
  Object.keys(_notifyTimers).forEach(k => delete _notifyTimers[k]);
  const now = Date.now();
  const horizon = 24 * 60 * 60 * 1000;
  Object.values(events).flat().forEach(ev => {
    const reminderMin = ev.reminderMin ?? 15;
    if (!reminderMin) return;
    const [y, m, d] = ev.date.split('-').map(Number);
    const eventMs = new Date(y, m - 1, d).getTime() + ev.start * 3600000;
    const fireMs  = eventMs - reminderMin * 60000;
    const delay   = fireMs - now;
    if (delay > 0 && delay < horizon) {
      _notifyTimers[ev.id] = setTimeout(() => {
        new Notification(`📅 ${ev.title}`, {
          body: `Starting in ${reminderMin} min  •  ${formatHour(ev.start)}`,
          tag: ev.id
        });
      }, delay);
    }
  });
}

}

function renderColorLegendBar() { renderWeekChart(); }

function renderWeekChart() {
  const section = document.getElementById('chartContent');
  if (!section) return;

  // Tally hours per colorIdx across the displayed week
  const totals = {};
  getWeekDays().forEach(date => {
    const ds = dateStrFromDate(date);
    getDayEvents(ds).forEach(ev => {
      const dur = Math.min(ev.end, 24) - ev.start;
      if (dur <= 0) return;
      const idx = ev.colorIdx || 0;
      totals[idx] = (totals[idx] || 0) + dur;
    });
  });

  const entries = Object.entries(totals)
    .map(([i, h]) => ({ idx: +i, hours: h, c: COLORS[+i], lbl: colorLabels[+i] || `Color ${+i + 1}` }))
    .filter(e => e.hours > 0)
    .sort((a, b) => b.hours - a.hours);

  if (!entries.length) {
    section.innerHTML = `<p class="chart-empty">No events this week</p>`;
    return;
  }

  const total  = entries.reduce((s, e) => s + e.hours, 0);
  const cx = 60, cy = 60, R = 52, ri = 30;
  let angle = -Math.PI / 2;

  const slices = entries.map(e => {
    const sweep = (e.hours / total) * 2 * Math.PI;
    const cos1 = Math.cos(angle),          sin1 = Math.sin(angle);
    const cos2 = Math.cos(angle + sweep),  sin2 = Math.sin(angle + sweep);
    const x1 = cx + R  * cos1,  y1 = cy + R  * sin1;
    const x2 = cx + R  * cos2,  y2 = cy + R  * sin2;
    const xi1= cx + ri * cos1, yi1 = cy + ri * sin1;
    const xi2= cx + ri * cos2, yi2 = cy + ri * sin2;
    const lg = sweep > Math.PI ? 1 : 0;
    const fmt = n => n.toFixed(2);
    const d = `M${fmt(x1)},${fmt(y1)} A${R},${R},0,${lg},1,${fmt(x2)},${fmt(y2)} L${fmt(xi2)},${fmt(yi2)} A${ri},${ri},0,${lg},0,${fmt(xi1)},${fmt(yi1)} Z`;
    angle += sweep;
    return `<path d="${d}" fill="${e.c.dot}" stroke="var(--surface)" stroke-width="2.5"/>`;
  }).join('');

  const totalTxt = total >= 1 ? `${total.toFixed(1)}h` : `${Math.round(total * 60)}m`;
  const svg = `<svg width="120" height="120" viewBox="0 0 120 120">
    ${slices}
    <text x="60" y="57" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ui-text)">${totalTxt}</text>
    <text x="60" y="69" text-anchor="middle" font-size="8.5" fill="var(--muted)">this week</text>
  </svg>`;

  const legend = entries.map(e => {
    const pct = Math.round(e.hours / total * 100);
    const val = e.hours >= 1 ? `${e.hours.toFixed(1)}h` : `${Math.round(e.hours * 60)}m`;
    return `<div class="chart-legend-item">
      <span class="chart-dot" style="background:${e.c.dot}"></span>
      <span class="chart-lbl" title="${e.lbl}">${e.lbl}</span>
      <span class="chart-val">${val}&thinsp;<span class="chart-pct">${pct}%</span></span>
    </div>`;
  }).join('');

  section.innerHTML = `<div class="chart-donut-wrap">${svg}<div class="chart-legend">${legend}</div></div>`;
}

// ══ Canadian stat holidays ════════════════════════════════
function getEaster(year) {
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  return new Date(year, Math.floor((h+l-7*m+114)/31)-1, (h+l-7*m+114)%31+1);
}
function getCanadianHolidays(year) {
  const hols = {};
  const add = (m, d, name) =>
    hols[`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`] = name;

  add(1,  1,  "New Year's");
  add(7,  1,  "Canada Day");
  add(9,  30, "Truth & Rec.");
  add(11, 11, "Remembrance");
  add(12, 25, "Christmas");
  add(12, 26, "Boxing Day");

  const easter = getEaster(year);
  const gf = new Date(easter); gf.setDate(easter.getDate() - 2);
  add(gf.getMonth()+1, gf.getDate(), "Good Friday");

  // Victoria Day: last Monday on or before May 24
  const may24dow = new Date(year, 4, 24).getDay();
  add(5, 24 - (may24dow+6)%7, "Victoria Day");

  // Labour Day: first Monday in September
  const sep1dow = new Date(year, 8, 1).getDay();
  add(9, 1 + (8-sep1dow)%7, "Labour Day");

  // Thanksgiving: second Monday in October
  const oct1dow = new Date(year, 9, 1).getDay();
  add(10, 1 + (8-oct1dow)%7 + 7, "Thanksgiving");

  return hols;
}

// ══ Place events ═════════════════════════════════════════
function layoutDayEvents(dayEvents) {
  if (!dayEvents.length) return [];
  const gs = ev => ev._dispStart !== undefined ? ev._dispStart : ev.start;
  const ge = ev => ev._dispEnd   !== undefined ? ev._dispEnd   : Math.min(ev.end, 24);
  const sorted = [...dayEvents].sort((a, b) => gs(a) !== gs(b) ? gs(a) - gs(b) : ge(b) - ge(a));
  const colEnds = [];
  const assigned = sorted.map(ev => {
    let col = colEnds.findIndex(end => end <= gs(ev));
    if (col === -1) col = colEnds.length;
    colEnds[col] = ge(ev);
    return { ev, col };
  });
  return assigned.map(item => {
    const overlapping = assigned.filter(o =>
      o.ev !== item.ev && gs(o.ev) < ge(item.ev) && ge(o.ev) > gs(item.ev)
    );
    const totalCols = overlapping.length > 0
      ? Math.max(item.col, ...overlapping.map(o => o.col)) + 1
      : 1;
    return { ev: item.ev, col: item.col, totalCols };
  });
}
function placeEvents(weekDays) {
  weekDays.forEach(date => {
    const ds = dateStrFromDate(date);
    const allDayEvs = getDayEvents(ds).filter(ev => ev.allDay);
    const timedEvs  = getDayEvents(ds).filter(ev => !ev.allDay);
    // Render all-day events in the day header
    if (allDayEvs.length) {
      const hdr = document.querySelector(`.day-header[data-date="${ds}"]`);
      if (hdr) {
        let strip = hdr.querySelector('.allday-strip');
        if (!strip) { strip = document.createElement('div'); strip.className = 'allday-strip'; hdr.appendChild(strip); }
        allDayEvs.forEach(ev => renderAlldayEvent(ev, strip));
      }
    }
    // Events from previous day that continue into this day
    const contEvs = [];
    Object.values(events).forEach(arr => arr.forEach(ev => {
      if (!ev.allDay && ev.date === prevDayStr(ds) && ev.end > 24)
        contEvs.push({...ev, _dispStart: 0, _dispEnd: ev.end - 24, _isCont: true});
    }));
    const layout = layoutDayEvents([...timedEvs, ...contEvs]);
    layout.forEach(({ ev, col, totalCols }) => {
      if (ev._isCont) renderCont(ev, ds, col, totalCols);
      else            renderEvent(ev, ds, col, totalCols);
    });
  });
}
function renderAlldayEvent(ev, strip) {
  const c = COLORS[ev.colorIdx||0];
  const el = document.createElement('div');
  el.className = 'ev-allday';
  el.style.background = c.bg;
  el.style.color      = c.text;
  el.style.borderLeft = `3px solid ${c.border}`;
  const titleSpan = document.createElement('span');
  titleSpan.textContent = (ev.recurringId ? '↻ ' : '') + ev.title;
  titleSpan.style.overflow = 'hidden'; titleSpan.style.textOverflow = 'ellipsis';
  el.appendChild(titleSpan);
  const del = document.createElement('span'); del.className = 'ev-del'; del.textContent = '✕';
  del.addEventListener('click', e => { e.stopPropagation(); confirmDeleteEvent(ev.id); });
  el.appendChild(del);
  el.addEventListener('click', e => { e.stopPropagation(); openEditModal(ev.id); });
  strip.appendChild(el);
}
function getDayEvents(ds) {
  const list = [];
  Object.values(events).forEach(arr => arr.forEach(ev => { if (ev.date===ds) list.push(ev); }));
  return list.sort((a,b) => a.start-b.start);
}
// ══ Resize ═══════════════════════════════════════════════
function startResize(e, evId) {
  e.preventDefault(); e.stopPropagation();
  const ev = findEvent(evId); if (!ev) return;
  const el = e.currentTarget.closest('.event');
  resizeState = { eventId: evId, startTime: ev.start, origEnd: ev.end, currentEnd: ev.end, startY: e.clientY, el };
  el.classList.add('is-resizing');
  document.addEventListener('mousemove', onResizeMove);
  document.addEventListener('mouseup',   onResizeUp);
}
function onResizeMove(e) {
  if (!resizeState) return;
  const SLOT_PX = 44;
  const origSlots = (resizeState.origEnd - resizeState.startTime) / 0.5;
  const newSlots  = Math.max(1, Math.round((origSlots * SLOT_PX + e.clientY - resizeState.startY) / SLOT_PX));
  resizeState.currentEnd = Math.min(48, resizeState.startTime + newSlots * 0.5);
  // Visual height caps at midnight (end of this day's grid)
  const maxSlots = (24 - resizeState.startTime) / 0.5;
  const visSlots = Math.min(newSlots, maxSlots);
  resizeState.el.style.height = `${Math.max(22, visSlots * SLOT_PX - 4)}px`;
  resizeState.el.classList.toggle('ev-overnight', resizeState.currentEnd > 24);
  const timeEl = resizeState.el.querySelector('.ev-time');
  if (timeEl) timeEl.textContent = `${formatHour(resizeState.startTime)} – ${formatHourExt(resizeState.currentEnd)}`;
}
function onResizeUp() {
  if (!resizeState) return;
  document.removeEventListener('mousemove', onResizeMove);
  document.removeEventListener('mouseup',   onResizeUp);
  resizeState.el.classList.remove('is-resizing');
  if (resizeState.currentEnd !== resizeState.origEnd) {
    justResized = true;
    updateEvent(resizeState.eventId, { end: resizeState.currentEnd });
    saveAll(); renderCalendar();
  }
  resizeState = null;
}

function makeLocationEl(location) {

  a.appendChild(document.createTextNode(location));
  a.addEventListener('click', e => e.stopPropagation());
  span.appendChild(a);
  return span;
}

function renderEvent(ev, ds, col, totalCols) {
  const cell = document.querySelector(`.day-cell[data-date="${ds}"][data-hour="${ev.start}"]`);
  if (!cell) return;
  const c = COLORS[ev.colorIdx||0];
  const el = document.createElement('div');
  const SLOT_PX = 44;
  const isOvernight = ev.end > 24;
  const visEnd  = Math.min(ev.end, 24);
  const slots   = (visEnd - ev.start) / 0.5;
  const evH     = Math.max(Math.round(slots * SLOT_PX) - 4, 22);
  const isTall  = slots > 1;

  el.className = 'event' + (isOvernight ? ' ev-overnight' : '');
  if (totalCols > 1) {
    const pct = 100 / totalCols;
    el.style.left  = `calc(${col * pct}% + 2px)`;
    el.style.width = `calc(${pct}% - 4px)`;
    el.style.right = 'auto';
  }
  el.style.background  = c.bg;
  el.style.color       = c.text;
  el.style.borderLeft  = `3px solid ${c.border}`;
  el.style.height      = `${evH}px`;
  el.draggable         = !isMobile(); // draggable swallows the first tap on touch; disable so a single tap opens edit
  el.dataset.eventId   = ev.id;
  el.dataset.date      = ds;
  el.dataset.hour      = ev.start;

  if (isTall) {
    const title = document.createElement('span'); title.className='ev-title'; title.textContent=ev.title; el.appendChild(title);
    const time  = document.createElement('span'); time.className='ev-time';
    time.textContent=`${formatHour(ev.start)} – ${formatHourExt(ev.end)}`; el.appendChild(time);
    if (ev.location) el.appendChild(makeLocationEl(ev.location));
    if (ev.recurringId) { const r=document.createElement('span'); r.className='ev-recur'; r.textContent='↻ Recurring'; el.appendChild(r); }
    if (isOvernight)    { const n=document.createElement('span'); n.className='ev-recur'; n.textContent='↓ continues +1d'; el.appendChild(n); }
  } else {
    const span = document.createElement('span'); span.className='ev-text';
    span.textContent = `${ev.recurringId?'↻ ':''}${formatHour(ev.start)} ${ev.title}`; el.appendChild(span);
  }

  const del = document.createElement('span'); del.className='ev-del'; del.textContent='✕';
  del.addEventListener('click', e => { e.stopPropagation(); confirmDeleteEvent(ev.id); });
  el.appendChild(del);

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'ev-resize';
  resizeHandle.addEventListener('mousedown', e => startResize(e, ev.id));
  el.appendChild(resizeHandle);

  el.addEventListener('click', e => {
    e.stopPropagation();
    if (justResized) { justResized = false; return; }
    openEditModal(ev.id);
  });
  el.addEventListener('dragstart', e => { if (resizeState) { e.preventDefault(); return; } onDragStart(e); });
  el.addEventListener('dragend',   onDragEnd);
  // Forward drag events through to the parent cell so drops work on occupied slots
  el.addEventListener('dragover',  e => {
    if (!dragData || dragData.eventId === ev.id) return;
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    if (!cell.classList.contains('drag-over')) {
      cell.classList.add('drag-over');
      const lbl = document.createElement('div');
      lbl.className = 'drag-time-lbl';
      lbl.textContent = formatHour(parseFloat(cell.dataset.hour));
      cell.appendChild(lbl);
    }
  });
  el.addEventListener('dragleave', e => {
    if (!cell.contains(e.relatedTarget)) {
      cell.classList.remove('drag-over');
      cell.querySelector('.drag-time-lbl')?.remove();
    }
  });
  el.addEventListener('drop',      e => { if (!dragData || dragData.eventId === ev.id) return; e.preventDefault(); e.stopPropagation(); onDrop.call(cell, e); });
  if (isMobile()) setupEventTouch(el, ev.id); // touch drag + single-tap edit (HTML5 DnD doesn't work on touch)
  cell.appendChild(el);
}

function renderCont(ev, ds, col, totalCols) {
  const cell = document.querySelector(`.day-cell[data-date="${ds}"][data-hour="0"]`);
  if (!cell) return;
  const c = COLORS[ev.colorIdx||0];

  if (totalCols > 1) {
    const pct = 100 / totalCols;

// ══ Event CRUD ═══════════════════════════════════════════
function addEventObj(ev) {
  const key = `${ev.date}|${ev.start}`;
  if (!events[key]) events[key]=[];
  events[key].push(ev);
}
function updateEvent(id, changes) {
  for (const key of Object.keys(events)) {
    const i = events[key].findIndex(e=>e.id===id);
    if (i!==-1) {
      const ev = {...events[key][i], ...changes};
      events[key].splice(i,1); if (!events[key].length) delete events[key];
      const nk = `${ev.date}|${ev.start}`;
      if (!events[nk]) events[nk]=[]; events[nk].push(ev);
      return;
    }
  }
}
function removeEvent(id) {
  for (const key of Object.keys(events)) {
    const i = events[key].findIndex(e=>e.id===id);
    if (i!==-1) { events[key].splice(i,1); if (!events[key].length) delete events[key]; return; }
  }
}
function findEvent(id) {
  for (const arr of Object.values(events)) { const ev=arr.find(e=>e.id===id); if(ev) return ev; }
  return null;
}
function removeAllByRecurId(rid) {
  for (const key of Object.keys(events)) {
    events[key] = events[key].filter(e => e.recurringId !== rid);
    if (!events[key].length) delete events[key];
  }
}
function updateAllByRecurId(rid, sourceId, changes) {
  for (const arr of Object.values(events)) {
    for (const ev of arr) {
      if (ev.recurringId !== rid) continue;
      ev.title      = changes.title;
      ev.start      = changes.start;
      ev.end        = changes.end;
      ev.allDay     = changes.allDay;
      ev.location   = changes.location;
      ev.notes      = changes.notes;
      ev.reminderMin = changes.reminderMin;
      ev.colorIdx   = changes.colorIdx;
      // keep each occurrence's own date; only update the edited one's date
      if (ev.id === sourceId) ev.date = changes.date;
    }
  }
}

// ── Recurring: generate dates ────────────────────────────
// Parse YYYY-MM-DD as a LOCAL date (avoids UTC midnight timezone shift)
function parseLocalDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function generateRecurDates(startDateStr, recurrence, endDateStr) {
  const dates    = [];
  const startDt  = parseLocalDate(startDateStr);
  const endDt    = endDateStr
    ? parseLocalDate(endDateStr)
    : (() => { const d = parseLocalDate(startDateStr); d.setMonth(d.getMonth() + 6); return d; })();
  const startDow = startDt.getDay();
  const cur      = parseLocalDate(startDateStr);

  while (cur <= endDt && dates.length < 400) {
    const dow = cur.getDay();
    const match =
      recurrence === 'daily'    ? true :
      recurrence === 'weekly'   ? dow === startDow :
      recurrence === 'weekdays' ? dow >= 1 && dow <= 5 :
      recurrence === 'weekends' ? dow === 0 || dow === 6 : false;
    if (match) dates.push(dateStr(cur.getFullYear(), cur.getMonth(), cur.getDate()));
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

// ══ Event Modal ═══════════════════════════════════════════
function syncDurFromEnd() {
  const start = parseFloat(document.getElementById('evStart').value);
  const end   = parseFloat(document.getElementById('evEnd').value);
  const dur   = end - start;
  if (isNaN(dur) || dur < 0) return;
  document.getElementById('evDurH').value = Math.floor(dur);
  document.getElementById('evDurM').value = dur % 1 !== 0 ? 30 : 0;
}
function syncEndFromDur() {
  const start = parseFloat(document.getElementById('evStart').value);
  const h  = parseInt(document.getElementById('evDurH').value)  || 0;
  const m  = parseInt(document.getElementById('evDurM').value)   || 0;
  const end = start + h + m / 60;
  if (!isNaN(end) && end > start) document.getElementById('evEnd').value = Math.min(48, end);
}

function setAlldayUI(isAllDay) {
  document.getElementById('evAllDay').checked = isAllDay;

function openEditModal(id) {

function closeModal() {
