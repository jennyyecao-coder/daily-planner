}
function saveModal() {
  const title = document.getElementById('evTitle').value.trim();
  if (!title) { document.getElementById('evTitle').focus(); return; }
  const date  = document.getElementById('evDate').value;
  const allDay = document.getElementById('evAllDay').checked;
  const start = allDay ? 0 : parseFloat(document.getElementById('evStart').value);
  const end   = allDay ? 24 : parseFloat(document.getElementById('evEnd').value);
  const location  = document.getElementById('evLocation').value.trim();
  const notes = document.getElementById('evNotes').value.trim();
  const reminderMin = parseInt(document.getElementById('evReminderMin').value) || 0;
  const recurrence = document.getElementById('evRecurrence').value;
  const recurEnd   = document.getElementById('evRecurEnd').value;

  if (editingEventId) {
    if (recurrence !== 'none') {
      removeEvent(editingEventId);
      const recurringId = genId();
      const dates = generateRecurDates(date, recurrence, recurEnd);
      dates.forEach(d => addEventObj({ id:genId(), title, date:d, start, end, allDay, location, notes, reminderMin, colorIdx:selectedColorIdx, recurringId }));
      saveAll(); closeModal(); renderCalendar(); return;
    }
    const changes = { title, date, start, end, allDay, location, notes, reminderMin, colorIdx: selectedColorIdx };
    const ev = findEvent(editingEventId);
    if (ev && ev.recurringId) {
      pendingRecurAction = { type: 'edit', id: editingEventId, recurringId: ev.recurringId, changes };
      document.getElementById('recurModalTitle').textContent = 'Edit Recurring Event';
      document.getElementById('recurModalMsg').textContent   = `"${ev.title}" is a recurring event. Edit just this occurrence or all?`;
      document.getElementById('recurAllBtn').textContent     = 'Edit all';
      document.getElementById('recurModalBackdrop').classList.add('open');
      return;
    }
    updateEvent(editingEventId, changes);
    saveAll(); closeModal(); renderCalendar(); return;
  }

  if (recurrence !== 'none') {
    const recurringId = genId();
    const dates = generateRecurDates(date, recurrence, recurEnd);
    dates.forEach(d => addEventObj({ id:genId(), title, date:d, start, end, allDay, location, notes, reminderMin, colorIdx:selectedColorIdx, recurringId }));
  } else {
    addEventObj({ id:genId(), title, date, start, end, allDay, location, notes, reminderMin, colorIdx:selectedColorIdx, recurringId:null });
  }
  saveAll(); closeModal(); renderCalendar();
}
function setupEventModalListeners() {
  document.getElementById('evAllDay').addEventListener('change', e => setAlldayUI(e.target.checked));
  document.getElementById('evStart').addEventListener('change', syncDurFromEnd);
  document.getElementById('evEnd').addEventListener('change',   syncDurFromEnd);
  document.getElementById('evDurH').addEventListener('input',   syncEndFromDur);
  document.getElementById('evDurM').addEventListener('change',  syncEndFromDur);
  document.getElementById('modalDelete').addEventListener('click', () => {
    if (!editingEventId) return;
    const id = editingEventId;
    closeModal();
    confirmDeleteEvent(id);
  });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target===document.getElementById('modalBackdrop')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key==='Escape') {
      closeModal();
      document.getElementById('recurModalBackdrop').classList.remove('open');
      document.getElementById('progressModalBackdrop').classList.remove('open');
      document.getElementById('colorLegendBackdrop').classList.remove('open');
    }
    if (e.key==='Enter' && document.getElementById('modalBackdrop').classList.contains('open')) {
      if (document.activeElement.tagName !== 'TEXTAREA') saveModal();
    }
  });
}

// ══ Cell click / drag ════════════════════════════════════
function onCellClick(e) {
  if (e.target.closest('.event')) return;
  openAddModal(this.dataset.date, parseFloat(this.dataset.hour));
}
function onDragStart(e) {
  const el=e.currentTarget;
  const rect=el.getBoundingClientRect();
  const offsetRows=Math.round((e.clientY-rect.top)/44)*0.5; // cursor offset in hours from event top
  dragData = { eventId:el.dataset.eventId, origDate:el.dataset.date, origHour:parseFloat(el.dataset.hour), offsetHours:offsetRows };
  el.style.opacity='0.5'; e.dataTransfer.effectAllowed='move';
  // Let cells receive dragover/drop even when events overlap them
  requestAnimationFrame(()=>document.body.classList.add('ev-dragging'));
}
function onDragEnd(e) {
  e.currentTarget.style.opacity='';
  document.body.classList.remove('ev-dragging');
  dragData=null;
  document.querySelectorAll('.day-cell.drag-over').forEach(c => {
    c.classList.remove('drag-over');
    c.querySelector('.drag-time-lbl')?.remove();
  });
}
function onDragOver(e) {
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  if (!this.classList.contains('drag-over')) {
    this.classList.add('drag-over');
    const lbl = document.createElement('div');
    lbl.className = 'drag-time-lbl';
    lbl.textContent = formatHour(parseFloat(this.dataset.hour));
    this.appendChild(lbl);
  }
}
function onDragLeave(e) {
  if (this.contains(e.relatedTarget)) return;
  this.classList.remove('drag-over');
  this.querySelector('.drag-time-lbl')?.remove();
}
function onDrop(e) {
  e.preventDefault(); this.classList.remove('drag-over'); this.querySelector('.drag-time-lbl')?.remove();
  if (!dragData) return;
  const cellHour = parseFloat(this.dataset.hour);
  const newDate  = this.dataset.date;
  // Snap event start directly to the dropped cell (ignoring grab offset)
  const clampedStart = Math.max(0, Math.min(23.5, cellHour));
  if (newDate===dragData.origDate && clampedStart===dragData.origHour) return;
  const ev = findEvent(dragData.eventId); if (!ev) return;
  const dur = ev.end - ev.start;
  updateEvent(dragData.eventId, { date:newDate, start:clampedStart, end:Math.min(clampedStart+dur,48) });
  saveAll(); renderCalendar();
}

// Touch-based drag for mobile (HTML5 drag-and-drop is not supported on touch).
// Drag is armed only after a long-press hold, so a normal tap (→ edit) and
// scrolling are never mistaken for a drag.
let touchDrag = null;
const LONG_PRESS_MS  = 1500; // hold this long to start moving an event
const MOVE_TOLERANCE = 18;   // finger movement (px) during the hold that cancels arming (= a tap/scroll); forgiving of jitter
function clearTouchDragVisual(el) {
  el.classList.remove('ev-moving');
  document.body.classList.remove('ev-dragging');
  document.querySelectorAll('.day-cell.drag-over').forEach(c => c.classList.remove('drag-over'));
}
function setupEventTouch(el, id) {
  el.addEventListener('touchstart', e => {
    if (e.target.closest('.ev-del') || e.target.closest('.ev-resize')) return; // let delete/resize handle their own taps
    const t = e.touches[0];
    touchDrag = { id, el, startX: t.clientX, startY: t.clientY, moved: false, armed: false, targetCell: null, timer: 0 };
    touchDrag.timer = setTimeout(() => {
      if (!touchDrag) return;
      touchDrag.armed = true;
      el.classList.add('ev-moving');                 // lighten the box to show it's being moved
      document.body.classList.add('ev-dragging');     // disable pointer-events on events so elementFromPoint hits cells
      if (navigator.vibrate) navigator.vibrate(30);   // little buzz to confirm drag is ready
    }, LONG_PRESS_MS);
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!touchDrag || touchDrag.id !== id) return;
    const t = e.touches[0];
    const dist = Math.hypot(t.clientX - touchDrag.startX, t.clientY - touchDrag.startY);
    if (!touchDrag.armed) {
      // Moving before the hold completes = a scroll/tap, not a drag → cancel arming
      if (dist > MOVE_TOLERANCE) { clearTimeout(touchDrag.timer); touchDrag.moved = true; }
      return;
    }
    // Armed: this is a drag — reposition and highlight the target cell
    e.preventDefault();
    const under = document.elementFromPoint(t.clientX, t.clientY);
    const cell  = under && under.closest('.day-cell');
    document.querySelectorAll('.day-cell.drag-over').forEach(c => c.classList.remove('drag-over'));
    if (cell) cell.classList.add('drag-over');
    touchDrag.targetCell = cell || null;
  }, { passive: false });

  el.addEventListener('touchend', e => {
    if (!touchDrag || touchDrag.id !== id) return;
    clearTimeout(touchDrag.timer);
    const { armed, moved, targetCell } = touchDrag;
    clearTouchDragVisual(el);
    touchDrag = null;
    if (!armed) {
      if (!moved) { e.preventDefault(); openEditModal(id); } // clean tap → edit
      return;                                                 // moved-but-not-armed = scroll, do nothing
    }
    e.preventDefault();
    if (targetCell) {
      const newDate = targetCell.dataset.date;
      const clampedStart = Math.max(0, Math.min(23.5, parseFloat(targetCell.dataset.hour)));
      const ev = findEvent(id);
      if (ev && !(newDate === ev.date && clampedStart === ev.start)) {
        const dur = ev.end - ev.start;
        updateEvent(id, { date: newDate, start: clampedStart, end: Math.min(clampedStart + dur, 48) });
        saveAll(); renderCalendar();
      }
    }
  }, { passive: false });

  el.addEventListener('touchcancel', () => {
    if (!touchDrag) return;
    clearTimeout(touchDrag.timer);
    clearTouchDragVisual(el);
    touchDrag = null;
  }, { passive: true });
}

// ══ Priorities ════════════════════════════════════════════
function getWeekKey()   { return dateStrFromDate(currentWeekStart); }
function getWeekPrios() { return priorities[getWeekKey()] || []; }

function renderPriorities() {
  const list = document.getElementById('prioritiesList');
  list.innerHTML = '';
  document.getElementById('prioWeekRange').textContent = weekRangeLabel();
  const prios = getWeekPrios();
  if (!prios.length) {
    const li = document.createElement('li'); li.className='prio-empty';
    li.textContent = 'No priorities yet.'; list.appendChild(li); return;
  }
  prios.forEach(p => {
    const isDone = p.target != null ? p.progress >= p.target : p.done;
    const li = document.createElement('li');
    li.className = 'prio-item'+(isDone?' done':'');
    li.dataset.id = p.id;
    li.innerHTML = buildPrioItemHTML(p, isDone);
    // Attach listeners after inserting HTML
    const badge = li.querySelector('.prio-badge');
    if (badge) badge.addEventListener('click', () => openProgressModal(p.id));
    const cb = li.querySelector('.prio-check');
    if (cb)    cb.addEventListener('change', () => togglePriority(p.id));
    li.querySelector('.prio-text').addEventListener('click', () => openPrioNotesModal(p.id));
    li.querySelector('.prio-edit-btn').addEventListener('click', () => startInlineEdit(p.id));
    li.querySelector('.prio-del-btn').addEventListener('click', () => deletePriority(p.id));
    list.appendChild(li);
  });
}

function buildPrioItemHTML(p, isDone) {
  let left;
  if (p.target != null) {
    const cls = isDone ? ' complete' : '';
    left = `<button class="prio-badge${cls}" title="Click to update progress">${p.progress}/${p.target}</button>`;
  } else {
    left = `<input type="checkbox" class="prio-check"${isDone?' checked':''}>`;
  }
  const notesDot = p.notes ? `<span class="prio-notes-dot" title="Has notes"></span>` : '';
  const safeText = p.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  return `${left}<span class="prio-text" title="Click to add notes">${safeText}</span>${notesDot}<button class="prio-btn prio-edit-btn" title="Edit">✏️</button><button class="prio-btn prio-del-btn" title="Delete">✕</button>`;
}

// ── Inline edit for a priority ────────────────────────────
function startInlineEdit(id) {
  const p   = getWeekPrios().find(p => p.id === id); if (!p) return;
  const li  = document.querySelector(`.prio-item[data-id="${id}"]`); if (!li) return;
  const hasTarget = p.target != null;

  li.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'prio-edit-row';

  const textInp = document.createElement('input');
  textInp.type = 'text'; textInp.value = p.text;

  const targetLbl = document.createElement('span');
  targetLbl.className = 'edit-label'; targetLbl.textContent = 'Goal:';

  const targetInp = document.createElement('input');
  targetInp.type='number'; targetInp.placeholder='—'; targetInp.min='1';
  targetInp.value = hasTarget ? p.target : '';

  const saveBtn   = document.createElement('button');
  saveBtn.className='prio-btn prio-save-btn'; saveBtn.textContent='✓';
  const cancelBtn = document.createElement('button');
  cancelBtn.className='prio-btn prio-cancel-btn'; cancelBtn.textContent='✕';

  row.append(textInp, targetLbl, targetInp, saveBtn, cancelBtn);
  li.appendChild(row);
  textInp.focus(); textInp.select();

  const doSave = () => {
    const newText = textInp.value.trim(); if (!newText) return;
    const newTarget = targetInp.value ? parseInt(targetInp.value) : null;
    savePrioEdit(id, newText, newTarget);
  };
  saveBtn.addEventListener('click', doSave);
  cancelBtn.addEventListener('click', renderPriorities);
  textInp.addEventListener('keydown', e => { if(e.key==='Enter') doSave(); if(e.key==='Escape') renderPriorities(); });
}

function savePrioEdit(id, text, target) {
  const key = getWeekKey();
  const p   = (priorities[key]||[]).find(p => p.id===id); if (!p) return;
  p.text = text;
  if (target != null) {
    p.target   = target;
    p.progress = Math.min(p.progress||0, target);
  } else {
    delete p.target; delete p.progress;
  }
  saveAll(); renderPriorities();
}

function togglePriority(id) {
  const p = (priorities[getWeekKey()]||[]).find(p=>p.id===id); if (!p) return;
  p.done = !p.done; saveAll(); renderPriorities();
}
function deletePriority(id) {
  const key = getWeekKey();
  if (priorities[key]) { priorities[key]=priorities[key].filter(p=>p.id!==id); saveAll(); renderPriorities(); }
}
// ── Priority Notes Modal ──────────────────────────────────
let editingPrioNotesId = null;

function openPrioNotesModal(id) {
  const p = getWeekPrios().find(p => p.id === id);
  if (!p) return;
  editingPrioNotesId = id;
  document.getElementById('prioNotesHeading').textContent = p.text;
  document.getElementById('prioNotesSubtitle').textContent =
    p.target != null ? `Progress: ${p.progress ?? 0} / ${p.target}` : '';
  document.getElementById('prioNotesText').value = p.notes || '';
  document.getElementById('prioNotesBackdrop').classList.add('open');
  document.getElementById('prioNotesText').focus();
}

function closePrioNotesModal() {
  document.getElementById('prioNotesBackdrop').classList.remove('open');
  editingPrioNotesId = null;
}

function savePrioNotes() {
  if (!editingPrioNotesId) return;
  const p = (priorities[getWeekKey()] || []).find(p => p.id === editingPrioNotesId);
  if (!p) return;
  const notes = document.getElementById('prioNotesText').value.trim();
  if (notes) p.notes = notes; else delete p.notes;
  saveAll();
  renderPriorities();
  closePrioNotesModal();
}

function setupPrioNotesListeners() {
  document.getElementById('prioNotesSaveBtn').addEventListener('click', savePrioNotes);
  document.getElementById('prioNotesCancelBtn').addEventListener('click', closePrioNotesModal);
  document.getElementById('prioNotesBackdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('prioNotesBackdrop')) closePrioNotesModal();
  });
  document.getElementById('prioNotesText').addEventListener('keydown', e => {
    if (e.key === 'Escape') closePrioNotesModal();
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) savePrioNotes();
  });
}

function addPriority(text, target) {
  const key = getWeekKey();
  if (!priorities[key]) priorities[key]=[];
  const p = { id:genId(), text, done:false };
  if (target) { p.target=target; p.progress=0; }
  priorities[key].push(p); saveAll(); renderPriorities();
}
function setupPriorityListeners() {
  const input  = document.getElementById('priorityInput');
  const tInput = document.getElementById('priorityTarget');
  const btn    = document.getElementById('priorityAddBtn');
  const submit = () => {
    const text = input.value.trim(); if (!text) return;
    const raw  = tInput.value.trim();
    const target = raw ? parseInt(raw) : null;
    addPriority(text, target||null);
    input.value=''; tInput.value=''; input.focus();
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
}

// ══ Progress Modal ════════════════════════════════════════
function openProgressModal(id) {
  const p = (priorities[getWeekKey()]||[]).find(p=>p.id===id); if (!p||p.target==null) return;
  editingPrioProgressId = id;
  document.getElementById('progItemLabel').textContent  = p.text;
  document.getElementById('progTargetHint').textContent = `Target: ${p.target}`;
  document.getElementById('progValueInput').value       = p.progress||0;
  document.getElementById('progressModalBackdrop').classList.add('open');
  document.getElementById('progValueInput').focus();
}
function setupProgressListeners() {
  const inp = document.getElementById('progValueInput');

  document.getElementById('progDecBtn').addEventListener('click', () => {
    const v = parseInt(inp.value)||0; inp.value = Math.max(0, v-1);
  });
  document.getElementById('progIncBtn').addEventListener('click', () => {
    const v   = parseInt(inp.value)||0;
    const key = getWeekKey();
    const p   = (priorities[key]||[]).find(p=>p.id===editingPrioProgressId);
    const max = p ? p.target : 9999;
    inp.value = Math.min(max, v+1);
  });
  document.getElementById('progSaveBtn').addEventListener('click', saveProgress);
  document.getElementById('progCancelBtn').addEventListener('click', () => {
    document.getElementById('progressModalBackdrop').classList.remove('open');
    editingPrioProgressId = null;
  });
  inp.addEventListener('keydown', e => { if(e.key==='Enter') saveProgress(); });
}
function saveProgress() {
  const key = getWeekKey();
  const p   = (priorities[key]||[]).find(p=>p.id===editingPrioProgressId); if (!p) return;
  const val = parseInt(document.getElementById('progValueInput').value)||0;
  p.progress = Math.max(0, Math.min(val, p.target));
  if (p.progress >= p.target) p.done = true;
  saveAll(); renderPriorities();
  document.getElementById('progressModalBackdrop').classList.remove('open');
  editingPrioProgressId = null;
}

// ══ Week Picker ═══════════════════════════════════════════
function openPicker() {
  pickerYear=currentWeekStart.getFullYear(); pickerMonth=currentWeekStart.getMonth();
  renderPicker();
  document.getElementById('weekPickerPopup').classList.add('open');
}
function closePicker() { document.getElementById('weekPickerPopup').classList.remove('open'); }
function renderPicker() {
  const grid=document.getElementById('wpGrid'), label=document.getElementById('wpMonthLabel');
  label.textContent=`${MONTHS_LONG[pickerMonth]} ${pickerYear}`;
  grid.innerHTML='';
  ['S','M','T','W','T','F','S'].forEach(d => {
    const th=document.createElement('div'); th.className='wp-th'; th.textContent=d; grid.appendChild(th);
  });
  const firstDow=new Date(pickerYear,pickerMonth,1).getDay();
  const daysInMonth=new Date(pickerYear,pickerMonth+1,0).getDate();
  const todayStr=dateStrFromDate(new Date()), selWeekStr=dateStrFromDate(currentWeekStart);
  for (let i=0;i<firstDow;i++) { const b=document.createElement('div'); b.className='wp-blank'; grid.appendChild(b); }
  for (let d=1;d<=daysInMonth;d++) {
    const date=new Date(pickerYear,pickerMonth,d), ds=dateStr(pickerYear,pickerMonth,d);
    const ws=getWeekStart(date), wsStr=dateStrFromDate(ws);
    const cell=document.createElement('div');
    cell.className='wp-day'+(ds===todayStr?' wp-today':'')+(wsStr===selWeekStr?' wp-in-selected-week':'');
    cell.textContent=d; cell.dataset.wsStr=wsStr;
    cell.addEventListener('click',()=>{ currentWeekStart=ws; if(isMobile()){currentMobileDay=new Date(date);currentMobileDay.setHours(0,0,0,0);} renderCalendar(); renderPriorities(); closePicker(); });
    cell.addEventListener('mouseenter',()=>document.querySelectorAll(`.wp-day[data-ws-str="${wsStr}"]`).forEach(el=>el.classList.add('wp-week-hover')));
    cell.addEventListener('mouseleave',()=>document.querySelectorAll('.wp-day.wp-week-hover').forEach(el=>el.classList.remove('wp-week-hover')));
    grid.appendChild(cell);
  }
  const lastDow=new Date(pickerYear,pickerMonth,daysInMonth).getDay();
  for (let i=0;i<(lastDow===6?0:6-lastDow);i++) { const b=document.createElement('div'); b.className='wp-blank'; grid.appendChild(b); }
}
function setupPickerListeners() {
  document.getElementById('weekLabelBtn').addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('weekPickerPopup').classList.contains('open') ? closePicker() : openPicker();
  });
  document.getElementById('wpPrevMonth').addEventListener('click', e => { e.stopPropagation(); pickerMonth--; if(pickerMonth<0){pickerMonth=11;pickerYear--;} renderPicker(); });
  document.getElementById('wpNextMonth').addEventListener('click', e => { e.stopPropagation(); pickerMonth++; if(pickerMonth>11){pickerMonth=0;pickerYear++;} renderPicker(); });
  document.addEventListener('click', e => { if (!document.getElementById('weekPickerWrap').contains(e.target)) closePicker(); });
}

// ══ Navigation ═══════════════════════════════════════════
function scrollToCurrentHour() {
  const now = new Date(), ds = dateStrFromDate(now);
  if (isMobile()) {
    const dayW = (window.innerWidth - 60) / 3;
    const mDs  = dateStrFromDate(currentMobileDay);
    const di   = getWeekDays().findIndex(d => dateStrFromDate(d) === mDs);
    document.getElementById('calendar-wrapper').scrollLeft = Math.max(0, di * dayW);
  }
  const cell = document.querySelector(`.day-cell[data-date="${ds}"][data-hour="${now.getHours()}"]`);
  if (cell) cell.scrollIntoView({behavior:'smooth', block:'center'});
}
document.getElementById('prevBtn').addEventListener('click', () => {
  currentWeekStart=new Date(currentWeekStart); currentWeekStart.setDate(currentWeekStart.getDate()-7);
  renderCalendar(); renderPriorities();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  currentWeekStart=new Date(currentWeekStart); currentWeekStart.setDate(currentWeekStart.getDate()+7);
  renderCalendar(); renderPriorities();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  currentWeekStart=getWeekStart(new Date()); renderCalendar(); renderPriorities(); setTimeout(scrollToCurrentHour,80);
});

// ══ Current time line ════════════════════════════════════
function updateTimeNowLine() {
  const existing = document.querySelector('.time-now-line');
  if (existing) existing.remove();

  const now = new Date();
  const todayStr = dateStrFromDate(now);
  const isCurrentWeek = getWeekDays().some(d => dateStrFromDate(d) === todayStr);
  if (!isCurrentWeek) return;

  // Measure actual cell position so the line is pixel-accurate regardless of header height
  const h = now.getHours(), m = now.getMinutes();
  const slotHour = m >= 30 ? h + 0.5 : h;
  const cell = document.querySelector(`.day-cell[data-date="${todayStr}"][data-hour="${slotHour}"]`);
  if (!cell) return;

  const cal = document.getElementById('calendar');
  const calTop  = cal.getBoundingClientRect().top;
  const cellTop = cell.getBoundingClientRect().top;
  const fracInSlot = (m % 30) / 30;
  const topPx = (cellTop - calTop) + fracInSlot * cell.offsetHeight + cal.scrollTop;

  const line = document.createElement('div');
  line.className = 'time-now-line';
  line.style.top = `${topPx}px`;
  cal.appendChild(line);
}

// ══ Export / Import ══════════════════════════════════════
function updateFolderBtn() {
  const btn = document.getElementById('folderBtn');
  if (!btn) return;
  if (!('showDirectoryPicker' in window)) { btn.style.display = 'none'; return; }
  if (fsDir) {
    btn.textContent = `📁 ${fsDir.name}`;
    btn.title = `Data folder: ${fsDir.name} — click to change`;
  } else {
    btn.textContent = '📁 Select Folder';
    btn.title = 'Select a folder to save data across all browsers';
  }
}

document.getElementById('folderBtn').addEventListener('click', async () => {
  if (!('showDirectoryPicker' in window)) return;
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    await connectAndLoad(dir);
    updateFolderBtn();
  } catch {} // user cancelled
});

// ══ Start ════════════════════════════════════════════════
init();
window.addEventListener('load', () => setTimeout(scrollToCurrentHour, 80));
setInterval(updateTimeNowLine, 60000);
</script>

<!-- ══ Firebase sync ══════════════════════════════════════ -->

<!-- Sync review modal -->
<div id="syncModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:center;justify-content:center;padding:1rem">
  <div style="background:var(--bg,#1e1e2e);border:1px solid var(--border,#444);border-radius:12px;max-width:500px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.4);color:var(--text,#cdd6f4)">
    <div style="padding:1rem 1.2rem;border-bottom:1px solid var(--border,#444);font-weight:700;font-size:1rem">☁️ Sync Review</div>
    <div id="syncModalBody" style="overflow-y:auto;padding:1rem 1.2rem;flex:1;display:flex;flex-direction:column;gap:.8rem;font-size:.88rem"></div>
    <div style="padding:.8rem 1.2rem;border-top:1px solid var(--border,#444);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap">
      <button id="syncKeepLocal"  style="padding:.4rem .9rem;border-radius:6px;border:1px solid var(--border,#444);background:var(--bg2,#313244);color:inherit;cursor:pointer;font-size:.85rem">Keep All Local</button>
      <button id="syncKeepCloud"  style="padding:.4rem .9rem;border-radius:6px;border:1px solid var(--border,#444);background:var(--bg2,#313244);color:inherit;cursor:pointer;font-size:.85rem">Keep All Cloud</button>
      <button id="syncApplyMerge" style="padding:.4rem .9rem;border-radius:6px;border:none;background:#3b7dd8;color:#fff;cursor:pointer;font-size:.85rem;font-weight:600">Apply ▶</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC7k3Q0-FSHQ15S7KTI3QSM9xptVujMrl0",
  authDomain: "daily-planner-eaeed.firebaseapp.com",
  projectId: "daily-planner-eaeed",
  storageBucket: "daily-planner-eaeed.firebasestorage.app",
  messagingSenderId: "689699634937",
  appId: "1:689699634937:web:cc96aa1079c8b20f596c28"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb   = firebase.firestore();
let fbUser = null;
let fbUnsub = null;

function fbDocRef() {
  return fbDb.collection('users').doc(fbUser.uid).collection('planner').doc('data');
}

function fbSave() {
  if (!fbUser) return;
  const savedAt = Date.now();
  localStorage.setItem('plannerSavedAt', String(savedAt));
  fbDocRef().set({ events, priorities, colorLabels, colorBases, savedAt }).catch(console.error);
}

function fbApply(data) {
  if (!data) return;
  if (data.events)      events      = data.events;
  if (data.priorities)  priorities  = data.priorities;
  if (data.colorLabels) colorLabels = data.colorLabels;
  if (data.colorBases)  { colorBases = data.colorBases; rebuildColors(); }
  renderCalendar();
  renderPriorities();
  renderColorLegendBar();
  scheduleNotifications();
}

function fbSubscribe() {
  if (fbUnsub) fbUnsub();
  fbUnsub = fbDocRef().onSnapshot(snap => {
    if (snap.exists) fbApply(snap.data());
  }, console.error);
}

// ── Merge helpers ─────────────────────────────────────────────────────────

function flattenEvents(evObj) {
  const m = new Map();
  for (const slot of Object.values(evObj || {}))
    for (const ev of slot) m.set(ev.id, ev);
  return m;
}

function unflattenEvents(evMap) {
  const out = {};
  for (const ev of evMap.values()) {
    const key = `${ev.date}|${ev.start}`;
    (out[key] = out[key] || []).push(ev);
  }
  return out;
}

function flattenPriorities(prObj) {
  const m = new Map();
  for (const [wk, list] of Object.entries(prObj || {}))
    for (const p of list) m.set(`${wk}::${p.id}`, { wk, p });
  return m;
}

function unflattenPriorities(prMap) {
  const out = {};
  for (const { wk, p } of prMap.values())
    (out[wk] = out[wk] || []).push(p);
  return out;
}

function normalizeItem(obj) {
  // Strip fields that are null, undefined, or empty string so Firestore round-trips compare cleanly
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    if (v === null || v === undefined || v === '') continue;
    out[k] = v;
  }
  return out;
}
function stableStr(obj) {
  const n = normalizeItem(obj);
  return JSON.stringify(n, Object.keys(n).sort());
}
function jsonEq(a, b) { return stableStr(a) === stableStr(b); }

function computeSyncDiff(localData, cloudData) {
  const lEvs = flattenEvents(localData.events),   cEvs = flattenEvents(cloudData.events);
  const lPrs = flattenPriorities(localData.priorities), cPrs = flattenPriorities(cloudData.priorities);

  const evLocalOnly = [], evCloudOnly = [], evConflicts = [], evSame = new Map();
  let _logged = 0;
  for (const id of new Set([...lEvs.keys(), ...cEvs.keys()])) {
    const l = lEvs.get(id), c = cEvs.get(id);
    if      (!c)           evLocalOnly.push(l);
    else if (!l)           evCloudOnly.push(c);
    else if (jsonEq(l, c)) evSame.set(id, l);
    else {
      if (_logged++ < 3) console.log('[SyncDiff] conflict example — local:', JSON.stringify(normalizeItem(l)), 'cloud:', JSON.stringify(normalizeItem(c)));
      evConflicts.push({ id, local: l, cloud: c });
    }
  }

  const prLocalOnly = [], prCloudOnly = [], prConflicts = [], prSame = new Map();
  for (const key of new Set([...lPrs.keys(), ...cPrs.keys()])) {
    const l = lPrs.get(key), c = cPrs.get(key);
    if      (!c)               prLocalOnly.push(l);
    else if (!l)               prCloudOnly.push(c);
    else if (jsonEq(l.p, c.p)) prSame.set(key, l);
    else                       prConflicts.push({ key, local: l, cloud: c });
  }

  return { evLocalOnly, evCloudOnly, evConflicts, evSame, prLocalOnly, prCloudOnly, prConflicts, prSame };
}

function buildMerged(diff, choices, inclLocal, inclCloud, localData, cloudData) {
  const evMap = new Map(diff.evSame);
  if (inclLocal) diff.evLocalOnly.forEach(ev => evMap.set(ev.id, ev));
  if (inclCloud) diff.evCloudOnly.forEach(ev => evMap.set(ev.id, ev));
  for (const c of diff.evConflicts)
    evMap.set(c.id, choices.get('ev:' + c.id) === 'cloud' ? c.cloud : c.local);

  const prMap = new Map(diff.prSame);
  if (inclLocal) diff.prLocalOnly.forEach(x => prMap.set(`${x.wk}::${x.p.id}`, x));
  if (inclCloud) diff.prCloudOnly.forEach(x => prMap.set(`${x.wk}::${x.p.id}`, x));
  for (const c of diff.prConflicts)
    prMap.set(c.key, choices.get('pr:' + c.key) === 'cloud' ? c.cloud : c.local);

  const localTs = parseInt(localStorage.getItem('plannerSavedAt') || '0', 10);
  const useCloud = (cloudData.savedAt || 0) > localTs;
  return {
    events:      unflattenEvents(evMap),
    priorities:  unflattenPriorities(prMap),
    colorLabels: (useCloud && cloudData.colorLabels) ? cloudData.colorLabels : localData.colorLabels,
    colorBases:  (useCloud && cloudData.colorBases)  ? cloudData.colorBases  : localData.colorBases,
  };
}

// ── Sync modal UI ──────────────────────────────────────────────────────────

function mkEl(tag, css, text) {
  const el = document.createElement(tag);
  if (css)  el.style.cssText = css;
  if (text) el.textContent = text;
  return el;
}

function buildGroupCard(title, preview, onToggle) {
  const card = mkEl('div', 'border:1px solid var(--border,#444);border-radius:8px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.3rem');
  const lbl  = mkEl('label', 'display:flex;align-items:center;gap:.5rem;cursor:pointer;font-weight:600');
  const cb   = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = true;
  cb.addEventListener('change', () => onToggle(cb.checked));
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode(title));
  card.appendChild(lbl);
  if (preview) card.appendChild(mkEl('div', 'color:var(--text-muted,#888);font-size:.8rem;padding-left:1.3rem', preview));
  return card;
}

function evLabel(ev) { return `${ev.title || '(untitled)'} — ${ev.date} ${formatHour(ev.start)}–${formatHour(ev.end)}`; }

function evDiff(a, b) {
  const d = [];
  if (a.title !== b.title) d.push(`title: "${a.title}"`);
  if (a.start !== b.start || a.end !== b.end) d.push(`${formatHour(a.start)}–${formatHour(a.end)}`);
  if ((a.notes || '') !== (b.notes || '')) d.push(`notes: "${(a.notes || '').slice(0, 40)}"`);
  return d.join('; ') || '(minor diff)';
}

function prDiff(a, b) {
  const d = [];
  if (a.text !== b.text) d.push(`"${a.text}"`);
  if (a.done !== b.done) d.push(a.done ? 'done' : 'not done');
  if (a.target !== b.target) d.push(`target ${a.target}`);
  if (a.progress !== b.progress) d.push(`progress ${a.progress}`);
  return d.join('; ') || '(minor diff)';
}

function buildConflictCard(key, title, localDesc, cloudDesc, choices) {
  const card = mkEl('div', 'border:1px solid var(--border,#444);border-radius:8px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.4rem');
  card.appendChild(mkEl('div', 'font-weight:600;font-size:.85rem', title));
  for (const [val, badge, bg, desc] of [['local','LOCAL','#3b7dd8',localDesc],['cloud','CLOUD','#0a7c52',cloudDesc]]) {
    const lbl   = mkEl('label', 'display:flex;align-items:flex-start;gap:.4rem;cursor:pointer;font-size:.83rem;line-height:1.4');
    const radio = document.createElement('input');
    radio.type = 'radio'; radio.name = key; radio.value = val; radio.style.marginTop = '2px';
    if (val === 'local') radio.checked = true;
    radio.addEventListener('change', () => choices.set(key, val));
    const span = mkEl('span', '');
    span.innerHTML = `<span style="background:${bg};color:#fff;padding:0 4px;border-radius:3px;font-size:.72rem;margin-right:.3rem">${badge}</span>${desc}`;
    lbl.appendChild(radio); lbl.appendChild(span);
    card.appendChild(lbl);
  }
  return card;
}

function showSyncModal(diff, localData, cloudData) {
  return new Promise(resolve => {
    const modal   = document.getElementById('syncModal');
    const body    = document.getElementById('syncModalBody');
    body.innerHTML = '';

    const choices = new Map();
    let inclLocal = true, inclCloud = true;

    const totalSame = diff.evSame.size + diff.prSame.size;
    if (totalSame)
      body.appendChild(mkEl('div', 'color:var(--text-muted,#888);font-size:.82rem',
        `${totalSame} item(s) identical — kept automatically.`));

    const localOnlyCount = diff.evLocalOnly.length + diff.prLocalOnly.length;
    if (localOnlyCount) {
      const names = [...diff.evLocalOnly.map(e => e.title || 'event'),
                     ...diff.prLocalOnly.map(x => x.p.text || 'priority')]
                    .slice(0, 3).join(', ') + (localOnlyCount > 3 ? '…' : '');
      body.appendChild(buildGroupCard(`Only in Local (${localOnlyCount})`, names, v => { inclLocal = v; }));
    }

    const cloudOnlyCount = diff.evCloudOnly.length + diff.prCloudOnly.length;
    if (cloudOnlyCount) {
      const names = [...diff.evCloudOnly.map(e => e.title || 'event'),
                     ...diff.prCloudOnly.map(x => x.p.text || 'priority')]
                    .slice(0, 3).join(', ') + (cloudOnlyCount > 3 ? '…' : '');
      body.appendChild(buildGroupCard(`Only in Cloud (${cloudOnlyCount})`, names, v => { inclCloud = v; }));
    }

    const totalConflicts = diff.evConflicts.length + diff.prConflicts.length;
    if (totalConflicts) {
      body.appendChild(mkEl('div', 'font-weight:600;font-size:.85rem',
        `Conflicts — same item, different data (${totalConflicts}):`));
      for (const c of diff.evConflicts) {
        const key = 'ev:' + c.id; choices.set(key, 'local');
        body.appendChild(buildConflictCard(key, evLabel(c.local),
          evDiff(c.local, c.cloud), evDiff(c.cloud, c.local), choices));
      }
      for (const c of diff.prConflicts) {
        const key = 'pr:' + c.key; choices.set(key, 'local');
        body.appendChild(buildConflictCard(key, `Priority: "${c.local.p.text || c.cloud.p.text}"`,
          prDiff(c.local.p, c.cloud.p), prDiff(c.cloud.p, c.local.p), choices));
      }
    }

    function finish(override) {
      const il = override === 'local' ? true  : override === 'cloud' ? false : inclLocal;
      const ic = override === 'local' ? false : override === 'cloud' ? true  : inclCloud;
      if (override) {
        for (const c of diff.evConflicts) choices.set('ev:' + c.id, override);
        for (const c of diff.prConflicts) choices.set('pr:' + c.key, override);
      }
      modal.style.display = 'none';
      resolve(buildMerged(diff, choices, il, ic, localData, cloudData));
    }

    document.getElementById('syncKeepLocal').onclick  = () => finish('local');
    document.getElementById('syncKeepCloud').onclick  = () => finish('cloud');
    document.getElementById('syncApplyMerge').onclick = () => finish();
    modal.style.display = 'flex';
  });
}

// Patch saveAll to also push to Firebase; stamp localStorage even when offline
const _origSaveAll = saveAll;
saveAll = function() {
  _origSaveAll();
  localStorage.setItem('plannerSavedAt', String(Date.now()));
  fbSave();
};

// Auth state
fbAuth.onAuthStateChanged(async user => {
  console.log('[Firebase] onAuthStateChanged:', user ? user.email : 'null');
  fbUser = user;
  const btn = document.getElementById('syncBtn');
  if (user) {
    btn.textContent = `☁️ ${user.displayName?.split(' ')[0] || 'Synced'}`;
    btn.title = `Signed in as ${user.email} — click to sign out`;
    try {
      const snap = await fbDocRef().get();
      if (!snap.exists) {
        fbSave(); // first sign-in: push local data up
      } else {
        const cloudData = snap.data();
        const localData = { events, priorities, colorLabels, colorBases };
        const diff      = computeSyncDiff(localData, cloudData);
        const totalDiff = diff.evLocalOnly.length + diff.evCloudOnly.length + diff.evConflicts.length
                        + diff.prLocalOnly.length + diff.prCloudOnly.length + diff.prConflicts.length;
        if (totalDiff > 0) {
          const merged = await showSyncModal(diff, localData, cloudData);
          events      = merged.events;
          priorities  = merged.priorities;
          colorLabels = merged.colorLabels;
          if (merged.colorBases) { colorBases = merged.colorBases; rebuildColors(); }
          renderCalendar(); renderPriorities(); renderColorLegendBar(); scheduleNotifications();
          _origSaveAll();
          localStorage.setItem('plannerSavedAt', String(Date.now()));
          fbSave();
        }
        // totalDiff === 0: data identical, nothing to do
      }
    } catch(e) { console.error(e); }
    fbSubscribe();
  } else {
    btn.textContent = '☁️ Sign In';
    btn.title = 'Sign in to sync across devices';
    if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  }
});

// Handle redirect result on page load (in case popup was blocked and we fell back to redirect)
fbAuth.getRedirectResult().then(result => {
  console.log('[Firebase] getRedirectResult:', result ? (result.user ? result.user.email : 'no user') : 'null');
}).catch(e => {
  console.error('[Firebase] getRedirectResult error:', e.code, e.message);
  if (e.code && e.code !== 'auth/no-auth-event') alert('Sign-in failed: ' + e.message);
});

document.getElementById('syncBtn').addEventListener('click', () => {
  if (fbUser) {
    fbAuth.signOut();
  } else {
    fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      console.error('[Firebase] signInWithPopup error:', e.code, e.message);
      alert('Sign-in failed: ' + e.message);
    });
  }
});
</script>
